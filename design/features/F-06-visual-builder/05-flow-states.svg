<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#71717a"/>
    </marker>
    <marker id="retry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/>
    </marker>
  </defs>

  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
    .muted{fill:#71717a;font-size:12px}
    .small{fill:#71717a;font-size:11px}
    .tiny{fill:#71717a;font-size:10px}
    .bold{font-weight:600;font-size:12px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .node{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
    .nodeSel{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}
    .nodeOff{fill:#fafafa;stroke:#a1a1aa;stroke-width:1.5;stroke-dasharray:5 4}
    .gate{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
    .gateReq{fill:#fff7ed;stroke:#ea580c;stroke-width:3.5}
    .gateSel{fill:#fff7ed;stroke:#2563eb;stroke-width:2.5}
    .gateOff{fill:#fafafa;stroke:#a1a1aa;stroke-width:1.5;stroke-dasharray:5 4}
    .box{fill:#f4f4f5;stroke:#d4d4d8}
    .boxSel{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
    .start{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}
    .endc{fill:#ffffff;stroke:#18181b;stroke-width:3}
    .line{stroke:#71717a;stroke-width:1.5;fill:none;marker-end:url(#arr)}
    .retry{stroke:#ea580c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#retry)}
    .warnT{fill:#b45309;font-size:11px}
    .errT{fill:#991b1b;font-size:12px}
    .btn{fill:#ffffff;stroke:#d4d4d8}
    .btnOn{fill:#2563eb}
    .primary{fill:#2563eb}
    .onPrimary{fill:#ffffff;font-weight:600}
    .off{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
    .alert{fill:#fef2f2;stroke:#dc2626}
    .warnBox{fill:#fffbeb;stroke:#f59e0b}
    .stepOn{fill:#2563eb}
    .stepDone{fill:#dbeafe;stroke:#2563eb}
    .stepTodo{fill:#ffffff;stroke:#a1a1aa}
    .rule{stroke:#2563eb;stroke-width:1.5}
    .ruleTodo{stroke:#d4d4d8;stroke-width:1.5}
    .lock{fill:#18181b;font-size:10px}
    .tab{fill:#f4f4f5}
    .tabOn{fill:#2563eb}
  </style>
  <rect width="1280" height="800" fill="#fafafa"/>
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="24" y="34" class="h1">SDDBuilder</text>
  <text x="170" y="34" class="muted">New project · Flow tab: refusals and switched-off blocks</text>

  <line x1="276" y1="92" x2="504" y2="92" class="rule"/>
  <line x1="536" y1="92" x2="764" y2="92" class="rule"/>
  <line x1="796" y1="92" x2="1024" y2="92" class="ruleTodo"/>
  <rect x="282" y="80" width="182" height="24" fill="#fafafa"/>
  <rect x="542" y="80" width="122" height="24" fill="#fafafa"/>
  <rect x="802" y="80" width="80" height="24" fill="#fafafa"/>
  <rect x="1062" y="80" width="166" height="24" fill="#fafafa"/>
  <circle cx="260" cy="92" r="16" class="stepDone"/><text x="256" y="97" class="h2">✓</text>
  <text x="286" y="97" class="muted">Project name and idea</text>
  <circle cx="520" cy="92" r="16" class="stepDone"/><text x="516" y="97" class="h2">✓</text>
  <text x="546" y="97" class="muted">Technical details</text>
  <circle cx="780" cy="92" r="16" class="stepOn"/><text x="776" y="97" class="onPrimary">3</text>
  <text x="806" y="97" class="h2">Workflow</text>
  <circle cx="1040" cy="92" r="16" class="stepTodo"/><text x="1036" y="97" class="muted">4</text>
  <text x="1066" y="97" class="muted">Analyze and generate</text>
  <rect x="212" y="118" width="50" height="30" rx="6" class="tab"/>
  <text x="224" y="138">Map</text>
  <rect x="270" y="118" width="82" height="30" rx="6" class="tab"/>
  <text x="282" y="138">specify</text>
  <rect x="360" y="118" width="42" height="30" rx="6" class="tab"/>
  <text x="372" y="138">ux</text>
  <rect x="410" y="118" width="58" height="30" rx="6" class="tab"/>
  <text x="422" y="138">plan</text>
  <rect x="476" y="118" width="66" height="30" rx="6" class="tabOn"/>
  <text x="488" y="138" class="onPrimary">build</text>
  <rect x="550" y="118" width="74" height="30" rx="6" class="tab"/>
  <text x="562" y="138">verify</text>
  <rect x="632" y="118" width="90" height="30" rx="6" class="tab"/>
  <text x="644" y="138">complete</text>
  <rect x="730" y="118" width="34" height="30" rx="6" class="btn"/>
  <text x="741" y="138" class="h2">+</text>
  <rect x="16" y="118" width="180" height="572" rx="8" class="panel"/>
  <text x="32" y="144" class="h2">Toolbox</text>
  <rect x="32" y="162" width="148" height="46" rx="6" class="box"/>
  <text x="42" y="181" class="bold">Start</text>
  <text x="42" y="198" class="tiny">entry of the flow</text>
  <rect x="32" y="218" width="148" height="46" rx="6" class="box"/>
  <text x="42" y="237" class="bold">Agent</text>
  <text x="42" y="254" class="tiny">runs an agent</text>
  <rect x="32" y="274" width="148" height="46" rx="6" class="box"/>
  <text x="42" y="293" class="bold">Condition</text>
  <text x="42" y="310" class="tiny">check with pass and fail</text>
  <rect x="32" y="330" width="148" height="46" rx="6" class="box"/>
  <text x="42" y="349" class="bold">Connection</text>
  <text x="42" y="366" class="tiny">artifact handed over</text>
  <rect x="32" y="386" width="148" height="46" rx="6" class="box"/>
  <text x="42" y="405" class="bold">End</text>
  <text x="42" y="422" class="tiny">done or stopped</text>
  <text x="32" y="452" class="small">Drag onto the flow,</text>
  <text x="32" y="468" class="small">or click to add at the end.</text>
  <text x="32" y="484" class="small"></text>
  <text x="32" y="500" class="small">Scope is set on each</text>
  <text x="32" y="516" class="small">Agent block.</text>
  <rect x="212" y="160" width="694" height="530" rx="8" class="panel"/>
  <line x1="266" y1="250" x2="280" y2="250" class="line"/>
  <line x1="384" y1="250" x2="398" y2="250" class="line"/>
  <line x1="462" y1="250" x2="476" y2="250" class="line"/>
  <line x1="580" y1="250" x2="594" y2="250" class="line"/>
  <line x1="336" y1="390" x2="350" y2="390" class="line"/>
  <line x1="417" y1="390" x2="431" y2="390" class="line"/>
  <line x1="481" y1="390" x2="495" y2="390" class="line"/>
  <line x1="545" y1="390" x2="559" y2="390" class="line"/>
  <line x1="663" y1="390" x2="677" y2="390" class="line"/>
  <path d="M619,275 V317.5 H284 V360" class="line"/>
  <circle cx="249" cy="250" r="17" class="start"/>
  <text x="249" y="286" class="small" text-anchor="middle">Start</text>
  <rect x="280" y="220" width="104" height="60" rx="8" class="node"/>
  <text x="332" y="246" class="bold" text-anchor="middle">implement</text>
  <text x="332" y="264" class="tiny" text-anchor="middle">per task</text>
  <rect x="398" y="238" width="64" height="24" rx="12" class="box"/>
  <text x="430" y="254" class="small" text-anchor="middle">code</text>
  <rect x="476" y="220" width="104" height="60" rx="8" class="node"/>
  <text x="528" y="246" class="bold" text-anchor="middle">review</text>
  <text x="528" y="264" class="tiny" text-anchor="middle">per task</text>
  <polygon points="619,225 644,250 619,275 594,250" class="gate"/>
  <text x="619" y="290" class="tiny" text-anchor="middle">review</text>
  <rect x="232" y="360" width="104" height="60" rx="8" class="nodeOff"/>
  <text x="284" y="386" class="bold" text-anchor="middle">test</text>
  <text x="284" y="404" class="tiny" text-anchor="middle">per task</text>
  <rect x="350" y="378" width="67" height="24" rx="12" class="box"/>
  <text x="383.5" y="394" class="small" text-anchor="middle">results</text>
  <polygon points="456,365 481,390 456,415 431,390" class="gate"/>
  <text x="456" y="430" class="tiny" text-anchor="middle">checks</text>
  <text x="456" y="443" class="warnT" text-anchor="middle">fail: implement</text>
  <polygon points="520,365 545,390 520,415 495,390" class="gateReq"/>
  <text x="520" y="430" class="tiny" text-anchor="middle">diff-size</text>
  <text x="520" y="443" class="warnT" text-anchor="middle">fail: stop</text>
  <rect x="559" y="360" width="104" height="60" rx="8" class="node"/>
  <text x="611" y="386" class="bold" text-anchor="middle">commit</text>
  <text x="611" y="404" class="tiny" text-anchor="middle">per task</text>
  <circle cx="694" cy="390" r="17" class="endc"/>
  <text x="694" y="426" class="small" text-anchor="middle">End</text>
  <path d="M619,225 C619,168 332,168 332,218" class="retry"/>
  <text x="475.5" y="176" class="warnT" text-anchor="middle">fail: back</text>
  <rect x="930" y="118" width="334" height="572" rx="8" class="panel"/>
  <text x="946" y="146" class="h2">Refusals</text>
  <text x="946" y="164" class="small">what the flow tab refuses</text>
  <rect x="946" y="180" width="302" height="66" rx="6" class="alert"/>
  <text x="956" y="200" class="h2">Cannot remove implement.</text>
  <text x="956" y="218" class="errT">review's fail and checks' fail</text>
  <text x="956" y="234" class="errT">both route back to it.</text>
  <rect x="946" y="256" width="302" height="66" rx="6" class="alert"/>
  <text x="956" y="276" class="h2">Cannot add a flow here.</text>
  <text x="956" y="294" class="errT">Flows hold blocks only: one</text>
  <text x="956" y="310" class="errT">level of nesting, in the pipeline.</text>
  <rect x="946" y="332" width="302" height="50" rx="6" class="alert"/>
  <text x="956" y="352" class="h2">Cannot switch off diff-size.</text>
  <text x="956" y="370" class="errT">It is required; the guard stays on.</text>
  <rect x="946" y="392" width="302" height="50" rx="6" class="off"/>
  <text x="956" y="412" class="h2">test is switched off.</text>
  <text x="956" y="430" class="muted">Kept in place: not run, not generated.</text>
  <rect x="16" y="706" width="110" height="38" rx="6" class="btn"/>
  <text x="50" y="730">Back</text>
  <rect x="1134" y="706" width="130" height="38" rx="6" class="primary"/>
  <text x="1174" y="730" class="onPrimary">Next</text>
  <text x="150" y="730" class="small">Next opens step 4: analyze the brief, then generate the project files.</text>
</svg>
