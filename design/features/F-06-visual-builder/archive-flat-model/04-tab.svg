<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#71717a"/>
    </marker>
    <marker id="retry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
    .muted{fill:#71717a;font-size:12px}
    .small{fill:#71717a;font-size:11px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .card{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
    .cardSel{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
    .btn{fill:#ffffff;stroke:#d4d4d8}
    .input{fill:#ffffff;stroke:#a1a1aa}
    .box{fill:#fafafa;stroke:#e4e4e7}
    .drop{fill:#ffffff;stroke:#a1a1aa;stroke-dasharray:5 4}
    .off{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
    .tag{fill:#f4f4f5;stroke:#d4d4d8}
    .tab{fill:#f4f4f5}
    .tabOn{fill:#2563eb}
    .onPrimary{fill:#ffffff;font-weight:600}
    .primary{fill:#2563eb}
    .gate{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
    .line{stroke:#71717a;stroke-width:1.5;fill:none;marker-end:url(#arr)}
    .retryLine{stroke:#ea580c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#retry)}
    .rule{stroke:#e4e4e7;stroke-width:1}
    .toggle{fill:#2563eb}
  </style>

  <rect width="1280" height="800" fill="#fafafa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="24" y="34" class="h1">SDDBuilder</text>
  <text x="170" y="34" class="muted">Demo project · Claude Code · reference process</text>
  <rect x="760" y="14" width="80" height="28" rx="6" class="btn"/><text x="782" y="33">Brief</text>
  <rect x="850" y="14" width="90" height="28" rx="6" class="primary"/><text x="872" y="33" class="onPrimary">Builder</text>

  <!-- Tabs: Map, then + to add a workflow, then one tab per workflow (Specify is open) -->
  <rect x="16" y="66" width="70" height="30" rx="6" class="tab"/><text x="36" y="86">Map</text>
  <rect x="92" y="66" width="34" height="30" rx="6" class="btn"/><text x="103" y="86" class="h2">+</text>
  <rect x="140" y="66" width="90" height="30" rx="6" class="tabOn"/><text x="160" y="86" class="onPrimary">Specify</text>
  <rect x="240" y="66" width="110" height="30" rx="6" class="tab"/><text x="260" y="86">Implement</text>
  <rect x="360" y="66" width="90" height="30" rx="6" class="tab"/><text x="380" y="86">Verify</text>
  <rect x="460" y="66" width="100" height="30" rx="6" class="tab"/><text x="480" y="86">Release</text>
  <text x="580" y="86" class="small">Click + next to Map to add a workflow.</text>

  <!-- Toolbox: every block a workflow can hold -->
  <rect x="16" y="110" width="220" height="662" rx="8" class="panel"/>
  <text x="32" y="138" class="h2">Toolbox</text>
  <text x="32" y="156" class="small">Drag onto the lane, or click to add.</text>

  <text x="32" y="184" class="small">STEPS (from the catalog)</text>
  <rect x="32" y="192" width="188" height="22" rx="4" class="box"/><text x="42" y="207" class="small">Define feature</text>
  <rect x="32" y="218" width="188" height="22" rx="4" class="box"/><text x="42" y="233" class="small">Refine</text>
  <rect x="32" y="244" width="188" height="22" rx="4" class="box"/><text x="42" y="259" class="small">Plan</text>
  <rect x="32" y="270" width="188" height="22" rx="4" class="box"/><text x="42" y="285" class="small">Implement</text>
  <rect x="32" y="296" width="188" height="22" rx="4" class="box"/><text x="42" y="311" class="small">Code review</text>
  <rect x="32" y="322" width="188" height="22" rx="4" class="box"/><text x="42" y="337" class="small">Unit tests</text>
  <rect x="32" y="348" width="188" height="22" rx="4" class="off"/><text x="42" y="363" class="small">E2E tests (off in catalog)</text>
  <rect x="32" y="374" width="188" height="22" rx="4" class="box"/><text x="42" y="389" class="small">Commit</text>
  <rect x="32" y="400" width="188" height="22" rx="4" class="box"/><text x="42" y="415" class="small">Verify</text>
  <rect x="32" y="426" width="188" height="22" rx="4" class="box"/><text x="42" y="441" class="small">Release</text>

  <text x="32" y="470" class="small">GATES (quality checks)</text>
  <rect x="32" y="478" width="188" height="22" rx="11" class="gate"/><text x="46" y="493" class="small">approval</text>
  <rect x="32" y="504" width="188" height="22" rx="11" class="gate"/><text x="46" y="519" class="small">checks</text>
  <rect x="32" y="530" width="188" height="22" rx="11" class="gate"/><text x="46" y="545" class="small">review</text>
  <rect x="32" y="556" width="188" height="22" rx="11" class="gate"/><text x="46" y="571" class="small">diff-size (line limit)</text>

  <text x="32" y="600" class="small">BRANCHES</text>
  <rect x="32" y="608" width="188" height="22" rx="4" class="box"/><text x="42" y="623" class="small">Retry route (fail goes back)</text>

  <text x="32" y="656" class="small">LATER</text>
  <rect x="32" y="664" width="188" height="22" rx="4" class="off"/><text x="42" y="679" class="small">Custom step (F-14)</text>
  <rect x="32" y="690" width="188" height="22" rx="4" class="off"/><text x="42" y="705" class="small">Custom gate (F-15)</text>

  <!-- Lane: the diagram and its step controls -->
  <rect x="252" y="110" width="648" height="450" rx="8" class="panel"/>
  <text x="268" y="134" class="small">Steps run left to right. Diamonds are conditions: pass continues, fail goes back or stops.</text>

  <rect x="272" y="200" width="150" height="96" rx="8" class="card"/>
  <text x="288" y="228" class="h2">Define feature</text>
  <text x="288" y="248" class="muted">command</text>
  <text x="288" y="266" class="small">produces stories.md</text>

  <rect x="462" y="200" width="150" height="96" rx="8" class="cardSel"/>
  <text x="478" y="228" class="h2">Refine</text>
  <text x="478" y="248" class="muted">command</text>
  <text x="478" y="266" class="small">produces stories.md</text>

  <rect x="652" y="200" width="150" height="96" rx="8" class="card"/>
  <text x="668" y="228" class="h2">Plan</text>
  <text x="668" y="248" class="muted">command</text>
  <text x="668" y="266" class="small">produces plan.md</text>

  <rect x="272" y="306" width="150" height="26" rx="6" class="btn"/><text x="280" y="323" class="small">↑ ↓  On ●  Remove</text>
  <rect x="462" y="306" width="150" height="26" rx="6" class="btn"/><text x="470" y="323" class="small">↑ ↓  On ●  Remove</text>
  <rect x="652" y="306" width="150" height="26" rx="6" class="btn"/><text x="660" y="323" class="small">↑ ↓  On ●  Remove</text>

  <line x1="422" y1="248" x2="462" y2="248" class="line"/>
  <line x1="612" y1="248" x2="652" y2="248" class="line"/>

  <!-- Condition after Plan: approval gate -->
  <polygon points="850,218 878,248 850,278 822,248" class="gate"/>
  <line x1="802" y1="248" x2="822" y2="248" class="line"/>
  <text x="800" y="296" class="small">approve-plan</text>
  <path d="M850,218 C850,170 537,170 537,200" class="retryLine"/>
  <text x="620" y="176" class="small">fail: back to Refine</text>

  <!-- Drop zone at the end of the lane -->
  <rect x="272" y="378" width="612" height="66" rx="8" class="drop"/>
  <text x="290" y="416" class="muted">Drop a block here, or click a toolbox item to add it at the end of the lane.</text>

  <!-- Inspector beside the lane -->
  <rect x="920" y="110" width="344" height="450" rx="8" class="panel"/>
  <text x="940" y="142" class="h2">Inspector · Refine</text>
  <text x="940" y="166" class="muted">Name and summary come from the catalog.</text>
  <text x="940" y="206" class="muted">Produces</text>
  <rect x="940" y="216" width="140" height="28" rx="6" class="box"/><text x="952" y="235">stories.md</text>
  <text x="940" y="274" class="muted">Rule-set tags</text>
  <rect x="940" y="284" width="92" height="26" rx="13" class="tag"/><text x="956" y="302" class="small">code.md</text>
  <rect x="1040" y="284" width="92" height="26" rx="13" class="tag"/><text x="1056" y="302" class="small">tests.md</text>
  <text x="940" y="350" class="small">A step with no file reads: no file generated.</text>

  <!-- Gates and branch routes of this workflow -->
  <rect x="252" y="572" width="1012" height="200" rx="8" class="panel"/>
  <text x="268" y="602" class="h2">Gates and branch routes</text>
  <text x="272" y="628" class="muted">Condition</text>
  <text x="470" y="628" class="muted">Type</text>
  <text x="600" y="628" class="muted">After step</text>
  <text x="720" y="628" class="muted">Pass</text>
  <text x="820" y="628" class="muted">Fail</text>
  <text x="1000" y="628" class="muted">Required</text>
  <text x="1100" y="628" class="muted">Switch</text>
  <line x1="268" y1="638" x2="1248" y2="638" class="rule"/>
  <text x="272" y="662">approve-plan</text>
  <text x="470" y="662">approval gate</text>
  <text x="600" y="662">Plan</text>
  <text x="720" y="662">next</text>
  <text x="820" y="662">Refine (retry)</text>
  <text x="1000" y="662">yes</text>
  <rect x="1100" y="650" width="64" height="22" rx="11" class="toggle"/><text x="1112" y="665" class="onPrimary">On</text>
  <text x="272" y="700" class="small">Round limit: none set. A required gate cannot be switched off.</text>
  <text x="272" y="720" class="small">Removing a step also removes the conditions after it (refused while another route points to it).</text>
  <text x="272" y="740" class="small">Switch Off keeps the gate, its routes and its round limit.</text>
</svg>
