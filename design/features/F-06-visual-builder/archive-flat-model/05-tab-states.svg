<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#71717a"/>
    </marker>
    <marker id="retryOff" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
    .muted{fill:#71717a;font-size:12px}
    .small{fill:#71717a;font-size:11px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .err{fill:#991b1b;font-size:12px}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .card{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
    .cardOff{fill:#fafafa;stroke:#a1a1aa;stroke-width:1.5;stroke-dasharray:5 4}
    .alert{fill:#fef2f2;stroke:#dc2626}
    .btn{fill:#ffffff;stroke:#d4d4d8}
    .box{fill:#fafafa;stroke:#e4e4e7}
    .gate{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
    .gateOff{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
    .gateRow{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
    .gateRowOff{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
    .off{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
    .tab{fill:#f4f4f5}
    .tabOn{fill:#2563eb}
    .onPrimary{fill:#ffffff;font-weight:600}
    .primary{fill:#2563eb}
    .line{stroke:#71717a;stroke-width:1.5;fill:none;marker-end:url(#arr)}
    .lineOff{stroke:#a1a1aa;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#retryOff)}
    .rule{stroke:#e4e4e7;stroke-width:1}
    .toggle{fill:#2563eb}
    .toggleOff{fill:#ffffff;stroke:#a1a1aa;stroke-width:1.5}
    .lock{fill:#f4f4f5;stroke:#a1a1aa}
  </style>

  <rect width="1280" height="800" fill="#fafafa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="24" y="34" class="h1">SDDBuilder</text>
  <text x="170" y="34" class="muted">Demo project · Claude Code · reference process</text>
  <rect x="760" y="14" width="80" height="28" rx="6" class="btn"/><text x="782" y="33">Brief</text>
  <rect x="850" y="14" width="90" height="28" rx="6" class="primary"/><text x="872" y="33" class="onPrimary">Builder</text>

  <!-- Tabs: Implement is open -->
  <rect x="16" y="66" width="70" height="30" rx="6" class="tab"/><text x="36" y="86">Map</text>
  <rect x="92" y="66" width="34" height="30" rx="6" class="btn"/><text x="103" y="86" class="h2">+</text>
  <rect x="140" y="66" width="90" height="30" rx="6" class="tab"/><text x="160" y="86">Specify</text>
  <rect x="240" y="66" width="110" height="30" rx="6" class="tabOn"/><text x="260" y="86" class="onPrimary">Implement</text>
  <rect x="360" y="66" width="90" height="30" rx="6" class="tab"/><text x="380" y="86">Verify</text>
  <rect x="460" y="66" width="100" height="30" rx="6" class="tab"/><text x="480" y="86">Release</text>

  <!-- Toolbox -->
  <rect x="16" y="110" width="220" height="662" rx="8" class="panel"/>
  <text x="32" y="138" class="h2">Toolbox</text>
  <text x="32" y="156" class="small">Drag onto the lane, or click to add.</text>
  <text x="32" y="184" class="small">STEPS (from the catalog)</text>
  <rect x="32" y="192" width="188" height="22" rx="4" class="box"/><text x="42" y="207" class="small">Define feature</text>
  <rect x="32" y="218" width="188" height="22" rx="4" class="box"/><text x="42" y="233" class="small">Refine</text>
  <rect x="32" y="244" width="188" height="22" rx="4" class="box"/><text x="42" y="259" class="small">Plan</text>
  <rect x="32" y="270" width="188" height="22" rx="4" class="box"/><text x="42" y="285" class="small">Implement</text>
  <rect x="32" y="296" width="188" height="22" rx="4" class="box"/><text x="42" y="311" class="small">Code review</text>
  <rect x="32" y="322" width="188" height="22" rx="4" class="box"/><text x="42" y="337" class="small">Unit tests</text>
  <rect x="32" y="348" width="188" height="22" rx="4" class="off"/><text x="42" y="363" class="small">E2E tests (off in catalog)</text>
  <rect x="32" y="374" width="188" height="22" rx="4" class="box"/><text x="42" y="389" class="small">Commit</text>
  <rect x="32" y="400" width="188" height="22" rx="4" class="box"/><text x="42" y="415" class="small">Verify</text>
  <rect x="32" y="426" width="188" height="22" rx="4" class="box"/><text x="42" y="441" class="small">Release</text>
  <text x="32" y="470" class="small">GATES (quality checks)</text>
  <rect x="32" y="478" width="188" height="22" rx="11" class="gate"/><text x="46" y="493" class="small">approval</text>
  <rect x="32" y="504" width="188" height="22" rx="11" class="gate"/><text x="46" y="519" class="small">checks</text>
  <rect x="32" y="530" width="188" height="22" rx="11" class="gate"/><text x="46" y="545" class="small">review</text>
  <rect x="32" y="556" width="188" height="22" rx="11" class="gate"/><text x="46" y="571" class="small">diff-size (line limit)</text>
  <text x="32" y="600" class="small">BRANCHES</text>
  <rect x="32" y="608" width="188" height="22" rx="4" class="box"/><text x="42" y="623" class="small">Retry route (fail goes back)</text>
  <text x="32" y="656" class="small">LATER</text>
  <rect x="32" y="664" width="188" height="22" rx="4" class="off"/><text x="42" y="679" class="small">Custom step (F-14)</text>
  <rect x="32" y="690" width="188" height="22" rx="4" class="off"/><text x="42" y="705" class="small">Custom gate (F-15)</text>

  <!-- Refusals above the lane -->
  <rect x="252" y="110" width="648" height="40" rx="6" class="alert"/>
  <text x="266" y="128" class="h2">Cannot remove Implement: it is required.</text>
  <text x="266" y="144" class="err">Required steps stay in every workflow. Their remove and switch-off controls are disabled.</text>

  <rect x="252" y="156" width="648" height="40" rx="6" class="alert"/>
  <text x="266" y="174" class="h2">Cannot remove Unit tests: another route points to it.</text>
  <text x="266" y="190" class="err">Switch that route off or point it elsewhere first. Nothing was removed.</text>

  <!-- Lane: Code review is switched off -->
  <rect x="252" y="210" width="648" height="310" rx="8" class="panel"/>

  <rect x="272" y="250" width="140" height="96" rx="8" class="card"/>
  <text x="286" y="278" class="h2">Implement</text>
  <text x="286" y="298" class="muted">required</text>
  <text x="286" y="316" class="small">remove: disabled</text>
  <text x="286" y="332" class="small">switch off: disabled</text>

  <rect x="452" y="250" width="140" height="96" rx="8" class="cardOff"/>
  <text x="466" y="278" class="h2">Code review</text>
  <text x="466" y="298" class="muted">switched off</text>
  <text x="466" y="316" class="small">kept in the list, not run</text>
  <text x="466" y="332" class="small">switch on to bring it back</text>

  <rect x="632" y="250" width="140" height="96" rx="8" class="card"/>
  <text x="646" y="278" class="h2">Unit tests</text>
  <text x="646" y="298" class="muted">on</text>
  <text x="646" y="316" class="small">removable</text>

  <line x1="412" y1="298" x2="452" y2="298" class="line"/>
  <line x1="592" y1="298" x2="632" y2="298" class="lineOff"/>

  <!-- diff-size gate between Implement and Code review: required, locked on -->
  <polygon points="432,282 448,298 432,314 416,298" class="gate"/>
  <text x="392" y="346" class="small">diff-size</text>
  <text x="372" y="360" class="small">required, locked on</text>

  <!-- checks-unit branch after Unit tests: switched off, round limit kept -->
  <line x1="772" y1="298" x2="814" y2="298" class="line"/>
  <polygon points="830,282 846,298 830,314 814,298" class="gateOff"/>
  <line x1="846" y1="298" x2="890" y2="298" class="line"/>
  <path d="M830,282 C830,232 342,232 342,250" class="lineOff"/>
  <text x="780" y="346" class="small">checks-unit · off</text>
  <text x="780" y="360" class="small">round limit 3 kept</text>

  <!-- Inspector: the switched-off branch -->
  <rect x="920" y="110" width="344" height="410" rx="8" class="panel"/>
  <text x="940" y="142" class="h2">Inspector · checks-unit</text>
  <text x="940" y="166" class="muted">Branch route after Unit tests</text>
  <text x="940" y="200">Pass: next</text>
  <text x="940" y="222">Fail: back to Implement</text>
  <text x="940" y="244">Round limit: 3</text>
  <rect x="940" y="262" width="150" height="30" rx="15" class="toggleOff"/><text x="956" y="282" class="muted">Off</text>
  <text x="940" y="320" class="small">Off keeps the route, its target and the round limit.</text>
  <text x="940" y="340" class="small">Switching On again restores all three unchanged.</text>
  <text x="940" y="380" class="muted">Required gates have no switch.</text>

  <!-- Switch table: what can be switched and what it keeps -->
  <rect x="252" y="540" width="1012" height="222" rx="8" class="panel"/>
  <text x="268" y="572" class="h2">Gate and route switches</text>
  <text x="272" y="600" class="muted">Condition</text>
  <text x="470" y="600" class="muted">Type</text>
  <text x="600" y="600" class="muted">Required</text>
  <text x="720" y="600" class="muted">Switch</text>
  <text x="900" y="600" class="muted">Round limit</text>
  <line x1="268" y1="610" x2="1248" y2="610" class="rule"/>

  <text x="272" y="636">diff-size</text>
  <text x="470" y="636">gate</text>
  <text x="600" y="636">yes</text>
  <rect x="720" y="622" width="64" height="22" rx="11" class="toggle"/><text x="732" y="637" class="onPrimary">On</text>
  <text x="800" y="636" class="small">locked: a required gate cannot be switched off</text>

  <text x="272" y="668">checks-unit</text>
  <text x="470" y="668">branch</text>
  <text x="600" y="668">no</text>
  <rect x="720" y="654" width="64" height="22" rx="11" class="toggleOff"/><text x="736" y="669" class="muted">Off</text>
  <text x="900" y="668">3 (kept while off)</text>

  <text x="272" y="700">review-clean</text>
  <text x="470" y="700">branch</text>
  <text x="600" y="700">no</text>
  <rect x="720" y="686" width="64" height="22" rx="11" class="toggle"/><text x="732" y="701" class="onPrimary">On</text>
  <text x="800" y="700" class="small">on, but its step Code review is off: no effect</text>
  <text x="900" y="700">none set</text>

  <text x="272" y="744" class="small">Switching an item back on restores it unchanged: its gate, routes and round limit come back as they were.</text>
</svg>
