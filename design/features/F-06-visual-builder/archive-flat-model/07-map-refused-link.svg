<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#71717a"/>
    </marker>
    <marker id="arrSel" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
    .muted{fill:#71717a;font-size:12px}
    .small{fill:#71717a;font-size:11px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .err{fill:#991b1b;font-size:12px}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .node{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
    .btn{fill:#ffffff;stroke:#d4d4d8}
    .input{fill:#ffffff;stroke:#dc2626;stroke-width:1.5}
    .select{fill:#ffffff;stroke:#a1a1aa}
    .alert{fill:#fef2f2;stroke:#dc2626}
    .tab{fill:#f4f4f5}
    .tabOn{fill:#2563eb}
    .onPrimary{fill:#ffffff;font-weight:600}
    .primary{fill:#2563eb}
    .gate{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
    .line{stroke:#71717a;stroke-width:1.5;fill:none;marker-end:url(#arr)}
    .lineSel{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrSel)}
    .handle{fill:#2563eb}
  </style>

  <rect width="1280" height="800" fill="#fafafa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="24" y="34" class="h1">SDDBuilder</text>
  <text x="170" y="34" class="muted">Demo project · Claude Code · reference process</text>
  <rect x="760" y="14" width="80" height="28" rx="6" class="btn"/><text x="782" y="33">Brief</text>
  <rect x="850" y="14" width="90" height="28" rx="6" class="primary"/><text x="872" y="33" class="onPrimary">Builder</text>

  <!-- Map and workflow tabs -->
  <rect x="16" y="66" width="70" height="30" rx="6" class="tabOn"/><text x="36" y="86" class="onPrimary">Map</text>
  <rect x="92" y="66" width="34" height="30" rx="6" class="btn"/><text x="103" y="86" class="h2">+</text>
  <rect x="140" y="66" width="90" height="30" rx="6" class="tab"/><text x="160" y="86">Specify</text>
  <rect x="240" y="66" width="110" height="30" rx="6" class="tab"/><text x="260" y="86">Implement</text>
  <rect x="360" y="66" width="90" height="30" rx="6" class="tab"/><text x="380" y="86">Verify</text>
  <rect x="460" y="66" width="100" height="30" rx="6" class="tab"/><text x="480" y="86">Release</text>

  <text x="16" y="130" class="muted">Press + next to Map to add a workflow.</text>

  <!-- Canvas: a duplicate connection was refused -->
  <rect x="16" y="152" width="884" height="608" rx="8" class="panel"/>
  <rect x="40" y="170" width="640" height="44" rx="6" class="alert"/>
  <text x="56" y="190" class="h2">Connection refused</text>
  <text x="56" y="206" class="err">Specify → Implement already exists in this direction. Nothing was added.</text>

  <rect x="60" y="250" width="200" height="130" rx="8" class="node"/>
  <text x="76" y="276" class="h2">Specify</text>
  <text x="76" y="298" class="muted">Scope: feature</text>
  <text x="76" y="316" class="muted">Iterates: features.md</text>
  <circle cx="260" cy="315" r="5" class="handle"/>

  <rect x="340" y="250" width="200" height="130" rx="8" class="node"/>
  <text x="356" y="276" class="h2">Implement</text>
  <text x="356" y="298" class="muted">Scope: task</text>
  <text x="356" y="316" class="muted">Iterates: plan.md</text>
  <circle cx="540" cy="315" r="5" class="handle"/>

  <rect x="620" y="250" width="200" height="130" rx="8" class="node"/>
  <text x="636" y="276" class="h2">Verify</text>
  <text x="636" y="298" class="muted">Scope: feature</text>
  <text x="636" y="316" class="muted">Iterates: features.md</text>
  <circle cx="820" cy="315" r="5" class="handle"/>

  <line x1="260" y1="315" x2="340" y2="315" class="line"/>
  <text x="268" y="304" class="small">plan.md</text>
  <line x1="540" y1="315" x2="620" y2="315" class="lineSel"/>
  <rect x="550" y="324" width="66" height="20" rx="10" class="gate"/>
  <text x="560" y="338" class="small">diff-size</text>

  <!-- Connection editor: a threshold of 0 is refused -->
  <rect x="920" y="152" width="344" height="608" rx="8" class="panel"/>
  <text x="940" y="184" class="h2">Connection</text>
  <text x="940" y="210">Implement → Verify</text>

  <text x="940" y="244" class="muted">Gate that holds Verify</text>
  <rect x="940" y="252" width="304" height="32" rx="6" class="select"/>
  <text x="952" y="273">diff-size ▾</text>

  <text x="940" y="308" class="muted">Threshold (lines, whole number of 1 or more)</text>
  <rect x="940" y="316" width="304" height="32" rx="6" class="input"/>
  <text x="952" y="337">0</text>
  <text x="940" y="368" class="err">Threshold must be a whole number of 1 or more.</text>
  <text x="940" y="386" class="muted">The old value is kept until a valid one is saved.</text>

  <rect x="940" y="420" width="120" height="34" rx="6" class="primary"/>
  <text x="972" y="442" class="onPrimary">Save</text>
  <rect x="1072" y="420" width="172" height="34" rx="6" class="btn"/>
  <text x="1094" y="442">Remove connection</text>
  <text x="940" y="490" class="small">Save applies the label and gate together. A refused value keeps the old connection.</text>
</svg>
