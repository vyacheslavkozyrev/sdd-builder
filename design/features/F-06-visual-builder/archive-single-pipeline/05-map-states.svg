    .tiny{fill:#71717a;font-size:10px}
    .bold{font-weight:600;font-size:12px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .node{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
    .nodeSel{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}
    .nodeOff{fill:#fafafa;stroke:#a1a1aa;stroke-width:1.5;stroke-dasharray:5 4}
    .gate{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
    .gateReq{fill:#fff7ed;stroke:#ea580c;stroke-width:3.5}
    .gateSel{fill:#fff7ed;stroke:#2563eb;stroke-width:2.5}
