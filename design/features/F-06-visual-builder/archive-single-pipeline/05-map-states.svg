  <text x="946" y="150" class="h2">Map states</text>
  <text x="946" y="168" class="small">what the map refuses or shows</text>
  <rect x="946" y="186" width="302" height="66" rx="6" class="alert"/>
  <text x="956" y="206" class="h2">Cannot remove plan.</text>
  <text x="956" y="224" class="errT">The approval after it routes back</text>
  <text x="956" y="240" class="errT">to plan. Change that route first.</text>
  <rect x="946" y="266" width="302" height="50" rx="6" class="alert"/>
  <text x="956" y="286" class="h2">Cannot switch off approval (plan).</text>
  <text x="956" y="304" class="errT">A required gate stays on.</text>
  <rect x="946" y="330" width="302" height="66" rx="6" class="off"/>
  <text x="956" y="350" class="h2">checks (verify) is switched off.</text>
  <text x="956" y="368" class="muted">Kept in place: not checked,</text>
  <text x="956" y="384" class="muted">not generated. Switch on to restore.</text>
  <text x="946" y="420" class="small">Thick outline on the map: required.</text>
  <text x="946" y="436" class="small">Dashed: switched off.</text>
