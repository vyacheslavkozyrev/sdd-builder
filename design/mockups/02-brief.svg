<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
    .muted{fill:#71717a;font-size:12px}
    .small{fill:#71717a;font-size:11px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .lbl{fill:#52525b;font-size:12px;font-weight:600}
    .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .box{fill:#ffffff;stroke:#d4d4d8}
    .btn{fill:#ffffff;stroke:#d4d4d8}
    .tab{fill:#f4f4f5}
    .primary{fill:#2563eb}
    .onPrimary{fill:#ffffff;font-weight:600}
    .disabled{fill:#e4e4e7}
    .onDisabled{fill:#71717a;font-weight:600}
    .info{fill:#eff6ff;stroke:#93c5fd}
  </style>

  <rect width="1280" height="940" fill="#fafafa"/>

  <!-- Top bar, Brief tab active -->
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="24" y="34" class="h1">SDDBuilder</text>
  <rect x="400" y="14" width="90" height="28" rx="6" class="tab"/><text x="420" y="33" class="h2">Brief</text>
  <text x="506" y="33" class="muted">step 1 of 3</text>
  <text x="600" y="33" class="muted">then: Lifecycle → Analyze → Generate</text>

  <!-- 1. Idea -->
  <rect x="40" y="80" width="840" height="170" rx="10" class="panel"/>
  <text x="60" y="108" class="h2">1. Idea</text>
  <text x="790" y="108" class="small">what the product is, who uses it, what problem it solves</text>
  <rect x="60" y="120" width="800" height="96" rx="6" class="box"/>
  <text x="74" y="142" class="muted">Hourly Tracker helps a household see when electricity is cheap…</text>
  <text x="74" y="162" class="muted">Describe the product in your own words. Plain language works best.</text>
  <text x="790" y="236" class="small">312 / 8,000</text>

  <!-- 2. Stack -->
  <rect x="40" y="270" width="840" height="150" rx="10" class="panel"/>
  <text x="60" y="298" class="h2">2. Stack</text>
  <text x="60" y="318" class="lbl">Language</text>
  <rect x="60" y="324" width="380" height="34" rx="6" class="box"/><text x="74" y="346">TypeScript</text><text x="420" y="346" class="muted">▾</text>
  <text x="460" y="318" class="lbl">Framework</text>
  <rect x="460" y="324" width="380" height="34" rx="6" class="box"/><text x="474" y="346">Node.js + Fastify</text>
  <text x="60" y="374" class="lbl">Test framework</text>
  <rect x="60" y="380" width="380" height="34" rx="6" class="box"/><text x="74" y="402">Vitest</text>
  <text x="460" y="374" class="lbl">Build tool</text>
  <rect x="460" y="380" width="380" height="34" rx="6" class="box"/><text x="474" y="402">npm workspaces</text>

  <!-- 3. Architecture -->
  <rect x="40" y="440" width="840" height="260" rx="10" class="panel"/>
  <text x="60" y="468" class="h2">3. Architecture</text>
  <text x="60" y="490" class="lbl">Style</text>
  <rect x="60" y="496" width="800" height="32" rx="6" class="box"/><text x="74" y="517">Layered; dependencies point one way (lower layer never imports higher)</text>
  <text x="60" y="552" class="lbl">Modules</text>
  <text x="60" y="572" class="small">NAME</text>
  <text x="230" y="572" class="small">LAYER</text>
  <text x="300" y="572" class="small">RESPONSIBILITY</text>
  <text x="640" y="572" class="small">DEPENDS ON</text>
  <line x1="60" y1="580" x2="860" y2="580" stroke="#e4e4e7"/>
  <text x="60" y="600">core</text><text x="230" y="600">0</text><text x="300" y="600">Domain types and generator</text><text x="640" y="600" class="muted">none</text>
  <text x="60" y="630">api</text><text x="230" y="630">1</text><text x="300" y="630">HTTP, LLM review, limits</text><text x="640" y="630">core</text>
  <text x="60" y="660">web</text><text x="230" y="660">1</text><text x="300" y="660">Visual builder</text><text x="640" y="660">core</text>
  <text x="840" y="600" class="muted">×</text><text x="840" y="630" class="muted">×</text><text x="840" y="660" class="muted">×</text>
  <rect x="60" y="676" width="130" height="10" rx="5" fill="none"/>
  <rect x="60" y="672" width="110" height="28" rx="6" class="btn"/><text x="74" y="691">+ Add module</text>

  <!-- 4. Rules -->
  <rect x="40" y="716" width="410" height="176" rx="10" class="panel"/>
  <text x="60" y="744" class="h2">4. Code rules</text>
  <text x="60" y="770">• Strict types; no any at boundaries</text>
  <text x="60" y="792">• Core has no file or network I/O</text>
  <text x="60" y="814">• Errors are never swallowed</text>
  <rect x="60" y="830" width="120" height="26" rx="6" class="btn"/><text x="74" y="848" class="small">+ Add rule</text>

  <rect x="470" y="716" width="410" height="176" rx="10" class="panel"/>
  <text x="490" y="744" class="h2">5. Test rules</text>
  <text x="490" y="770">• Every criterion has a named test</text>
  <text x="490" y="792">• No real network or LLM in tests</text>
  <text x="490" y="814">• Output is byte-identical per input</text>
  <rect x="490" y="830" width="120" height="26" rx="6" class="btn"/><text x="504" y="848" class="small">+ Add rule</text>

  <!-- Right column: privacy and action -->
  <rect x="904" y="80" width="336" height="250" rx="10" class="info"/>
  <text x="924" y="110" class="h2">Before you analyze</text>
  <text x="924" y="136">Your brief is sent to an AI model</text>
  <text x="924" y="154">provider for review. The service does not</text>
  <text x="924" y="172">store or log it, and the review only</text>
  <text x="924" y="190">advises. It never edits your setup.</text>
  <rect x="924" y="210" width="18" height="18" rx="3" class="box"/>
  <text x="952" y="224">I understand, send the brief for review</text>
  <text x="924" y="262" class="small">Checkbox is required before Analyze is enabled.</text>

  <rect x="904" y="346" width="336" height="44" rx="8" class="disabled"/>
  <text x="1000" y="373" class="onDisabled">Analyze (needs the checkbox)</text>

  <rect x="904" y="404" width="336" height="176" rx="10" class="panel"/>
  <text x="924" y="432" class="h2">Progress</text>
  <text x="924" y="458" class="muted">✓ Idea written</text>
  <text x="924" y="480" class="muted">✓ Stack chosen</text>
  <text x="924" y="502" class="muted">✓ Modules listed</text>
  <text x="924" y="524" class="muted">○ Rules (optional)</text>
  <text x="924" y="560" class="small">Nothing is saved between visits in the MVP.</text>
  <text x="924" y="576" class="small">Reloading the page clears the brief.</text>
</svg>
