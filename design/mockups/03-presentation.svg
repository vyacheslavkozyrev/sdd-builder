<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#fafafa;font-size:16px}
    .muted{fill:#a1a1aa;font-size:14px}
    .small{fill:#a1a1aa;font-size:13px}
    .title{font-size:30px;font-weight:600}
    .wf{fill:#27272a;stroke:#e4e4e7;stroke-width:1.5}
    .wfHi{fill:#1e3a8a;stroke:#60a5fa;stroke-width:1.5}
    .wfOff{fill:#18181b;stroke:#52525b;stroke-dasharray:6 5}
    .edge{stroke:#a1a1aa;stroke-width:2;fill:none;marker-end:url(#arrP)}
    .hint{fill:#18181b;stroke:#3f3f46}
    .pill{fill:#3f3f46}
    .b{font-weight:600}
  </style>

  <rect width="1280" height="800" fill="#09090b"/>

  <text x="48" y="70" class="title">Demo project: delivery process</text>
  <text x="1232" y="70" class="muted" text-anchor="end">Read-only · press Esc to exit</text>
  <text x="48" y="100" class="muted">Four workflows. Each feature is specified, built task by task, and verified before the release.</text>

  <!-- Global map: workflows and connections -->
  <rect x="80" y="170" width="280" height="150" rx="14" class="wf"/>
  <text x="104" y="210" class="b" style="font-size:20px">1  Specify</text>
  <rect x="104" y="226" width="150" height="24" rx="12" class="pill"/><text x="114" y="243" class="small">for each feature</text>
  <text x="104" y="280" class="small">Define, refine and plan. Ends in approval.</text>

  <rect x="500" y="170" width="280" height="150" rx="14" class="wfHi"/>
  <text x="524" y="210" class="b" style="font-size:20px">2  Implement</text>
  <rect x="524" y="226" width="150" height="24" rx="12" class="pill"/><text x="534" y="243" class="small">for each task</text>
  <text x="524" y="280" class="small">Code, review, test and commit each task.</text>

  <rect x="920" y="170" width="280" height="150" rx="14" class="wf"/>
  <text x="944" y="210" class="b" style="font-size:20px">3  Verify</text>
  <rect x="944" y="226" width="150" height="24" rx="12" class="pill"/><text x="954" y="243" class="small">for each feature</text>
  <text x="944" y="280" class="small">Every requirement has a passing test.</text>

  <rect x="920" y="400" width="280" height="130" rx="14" class="wf"/>
  <text x="944" y="440" class="b" style="font-size:20px">4  Release</text>
  <rect x="944" y="456" width="110" height="24" rx="12" class="pill"/><text x="954" y="473" class="small">runs once</text>
  <text x="944" y="506" class="small">Starts when every feature is verified.</text>

  <line x1="360" y1="245" x2="500" y2="245" class="edge"/>
  <text x="430" y="232" class="small" text-anchor="middle">stories, plan</text>
  <line x1="780" y1="245" x2="920" y2="245" class="edge"/>
  <text x="850" y="232" class="small" text-anchor="middle">each feature</text>
  <line x1="1060" y1="320" x2="1060" y2="400" class="edge"/>
  <text x="1072" y="366" class="small">all verified</text>

  <!-- Plain-language key for the client conversation -->
  <rect x="48" y="580" width="1184" height="170" rx="12" class="hint"/>
  <text x="72" y="614" class="b">How to read this</text>
  <text x="72" y="644" style="font-size:15px"><tspan class="b">Arrows</tspan> — a workflow starts only when the one before it has handed over its result.</text>
  <text x="72" y="668" style="font-size:15px"><tspan class="b">Approval</tspan> — the client or the owner signs off before work moves on.</text>
  <text x="72" y="692" style="font-size:15px"><tspan class="b">Checks</tspan> — automated tests and type checks decide if a task is done.</text>
  <text x="72" y="716" style="font-size:15px"><tspan class="b">Retries</tspan> — a failed review or test goes back to the step before it, up to the limit the team chose.</text>
  <text x="72" y="740" style="font-size:15px">Each completed task ends in one reviewed, tested commit.</text>
</svg>
