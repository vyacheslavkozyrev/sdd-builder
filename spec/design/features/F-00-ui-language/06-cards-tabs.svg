<text x="32" y="40" font-size="18" font-weight="500" fill="#32383E" text-anchor="start" >Cards, tabs, grid</text>
<text x="32" y="60" font-size="12" font-weight="400" fill="#636B74" text-anchor="start" >White cards: 12 px radius, 1 px #DDE7EE edge, soft shadow, 24 px padding. Tabs 32 px high, 8 px radius.</text>
