<text x="648" y="196" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Selected: #635BFF fill, white 13 px 500.  Unselected: white, #DDE7EE edge, 12 px ink.</text>
<text x="648" y="214" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Plus at the end of the row: 34 × 32, same look as the buttons.</text>
<text x="648" y="244" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Tab row sits above the card, 24 px from the top of the content area.</text>
<text x="648" y="262" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Tab text is the screen name in lower case, as in F-11.</text>
