<text x="308" y="410" font-size="12" font-weight="400" fill="#636B74" text-anchor="start" >Footer note: 12 px #636B74, at y 766 (below the card), x 284. Caption: 11 px #636B74, right edge at x 1256.</text>
<text x="308" y="430" font-size="12" font-weight="400" fill="#636B74" text-anchor="start" >The card-to-footer distance is 24 px (box top); the approved screens put the baseline at 766.</text>
