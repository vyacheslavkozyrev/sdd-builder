<text x="308" y="330" font-size="12" font-weight="400" fill="#636B74" text-anchor="start" >Next: #635BFF fill, white 14 px 500 label. On the last step Next is disabled (#F0F4F8, F-13 03).</text>
<text x="308" y="370" font-size="12" font-weight="400" fill="#636B74" text-anchor="start" >Content area: grey page #F0F4F8 around one white card, 12 px radius, from x 284 to 1256 and y 24 to 728.</text>
