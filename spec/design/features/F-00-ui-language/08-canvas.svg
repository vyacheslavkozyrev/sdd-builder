<text x="56" y="672" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Order: Agent, Condition, Link, Start, End. Icons 44 px apart, 16 px inside the box edge.</text>
<text x="56" y="700" font-size="12" font-weight="500" fill="#32383E" text-anchor="start" >Tooltips (shown on hover, no visible labels in the toolbox):</text>
<text x="56" y="720" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Agent: add an Agent block</text>
<text x="56" y="740" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Condition: add a Condition on an arrow</text>
<text x="56" y="760" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Link: link two blocks with an arrow</text>
<text x="56" y="780" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Start: add a Start block</text>
<text x="56" y="800" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >End: add an End block</text>
<text x="56" y="830" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Toolbox box: white, 1 px #DDE7EE edge, radius 10, shadow 2 px offset, blur 4, 16%.</text>
<text x="56" y="848" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Icon colours: Agent, Start primary. Link and Condition grey. End ink.</text></svg>
