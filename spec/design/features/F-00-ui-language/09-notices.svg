<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#32383E" flood-opacity="0.12"/></filter><filter id="shT" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#32383E" flood-opacity="0.16"/></filter><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#636B74"/></marker><marker id="arrP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#635BFF"/></marker></defs><style>@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap");text{font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif}</style><rect width="1280" height="800" fill="#F0F4F8"/>
<text x="32" y="40" font-size="18" font-weight="500" fill="#32383E" text-anchor="start" >Notices and states</text>
<text x="32" y="60" font-size="12" font-weight="400" fill="#636B74" text-anchor="start" >Error notice, amber note, grey note, status pills, empty state and pending state.</text>
<text x="1248" y="784" font-size="11" font-weight="400" fill="#636B74" text-anchor="end" >F-00 · sheet 09 · 1280 × 800</text>
<rect x="32" y="84" width="1216" height="96" rx="12" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="1" filter="url(#sh)" />
<text x="56" y="112" font-size="12" font-weight="500" fill="#32383E" text-anchor="start" >Error notification: top centre of the content area (derived, no approved top-centre screen)</text>
<rect x="360" y="124" width="560" height="42" rx="8" fill="#FEF3F2" stroke="#BB241A" stroke-width="1" />
<text x="380" y="142" font-size="12" font-weight="500" fill="#BB241A" text-anchor="start" >Could not analyze: the request timed out.</text>
<text x="380" y="158" font-size="12" font-weight="400" fill="#636B74" text-anchor="start" >Nothing was saved. Your brief is unchanged.</text>
<rect x="32" y="200" width="560" height="244" rx="12" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="1" filter="url(#sh)" />
<text x="56" y="228" font-size="14" font-weight="500" fill="#32383E" text-anchor="start" >Amber note (warning)</text>
<rect x="56" y="244" width="512" height="34" rx="6" fill="#FFFAEA" stroke="#FCD34D" stroke-width="1" />
<text x="72" y="266" font-size="12" font-weight="500" fill="#B84D05" text-anchor="start" >The idea is at the limit of 5,000 characters. Text past it is cut.</text>
<text x="56" y="296" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Amber: #FFFAEA fill, 1 px #FCD34D edge, radius 6, text 12 px 500 #B84D05.</text>
<text x="56" y="314" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Used for warnings in a note, not for errors.</text>
<rect x="56" y="332" width="512" height="84" rx="8" fill="#F0F4F8" stroke="#DDE7EE" stroke-width="1" />
<text x="72" y="354" font-size="12" font-weight="500" fill="#32383E" text-anchor="start" >Privacy notice</text>
<text x="72" y="374" font-size="13" font-weight="400" fill="#32383E" text-anchor="start" >Analyze sends the brief and the pipeline to the model for review.</text>
<text x="72" y="392" font-size="13" font-weight="400" fill="#32383E" text-anchor="start" >The server does not store or log the brief.</text>
<text x="56" y="434" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Grey note: #F0F4F8 fill, 1 px #DDE7EE edge, radius 8, title 12 px 500.</text>
<rect x="616" y="200" width="632" height="244" rx="12" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="1" filter="url(#sh)" />
<text x="640" y="228" font-size="14" font-weight="500" fill="#32383E" text-anchor="start" >Status pills (20 px high, 76 px wide, radius 10)</text>
<rect x="640" y="252" width="76" height="20" rx="10" fill="#FEF3F2" />
<text x="678" y="266" font-size="12" font-weight="500" fill="#BB241A" text-anchor="middle" >Blocker</text>
<text x="732" y="266" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Brief · Idea: the idea is blank.</text>
<rect x="640" y="296" width="76" height="20" rx="10" fill="#FFFAEA" />
<text x="678" y="310" font-size="12" font-weight="500" fill="#B84D05" text-anchor="middle" >Warning</text>
<text x="732" y="310" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Technical details: the rules list is empty.</text>
<rect x="640" y="340" width="76" height="20" rx="10" fill="#F0F4F8" />
<text x="678" y="354" font-size="12" font-weight="500" fill="#636B74" text-anchor="middle" >Info</text>
<text x="732" y="354" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Flow · verify: no check is set.</text>
<text x="640" y="396" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Colours: Blocker #BB241A on #FEF3F2 · Warning #B84D05 on #FFFAEA · Info #636B74 on #F0F4F8.</text>
<rect x="32" y="464" width="560" height="300" rx="12" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="1" filter="url(#sh)" />
<text x="56" y="492" font-size="14" font-weight="500" fill="#32383E" text-anchor="start" >Empty state (centred title and line)</text>
<circle cx="312" cy="580" r="44" fill="#F0F4F8" stroke="#DDE7EE" stroke-width="1"/>
<path d="M312 554 L318 574 L338 580 L318 586 L312 606 L306 586 L286 580 L306 574 Z" fill="#635BFF" stroke="#635BFF" stroke-width="0"/>
<text x="312" y="662" font-size="14" font-weight="500" fill="#32383E" text-anchor="middle" >No flows yet.</text>
<text x="312" y="684" font-size="12" font-weight="400" fill="#636B74" text-anchor="middle" >Add a flow with the + tab to start the pipeline.</text>
<text x="56" y="728" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Title 14 px 500 (F-08 01 uses 16 px: differs, see screens.md).</text>
<rect x="616" y="464" width="632" height="300" rx="12" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="1" filter="url(#sh)" />
<text x="640" y="492" font-size="14" font-weight="500" fill="#32383E" text-anchor="start" >Pending state (button with progress line)</text>
<rect x="640" y="512" width="360" height="40" rx="8" fill="#F0F4F8" stroke="#DDE7EE" stroke-width="1" />
<text x="820" y="537" font-size="14" font-weight="500" fill="#9FA6AD" text-anchor="middle" >Writing the files with the model…</text>
<rect x="640" y="562" width="360" height="4" rx="2" fill="#DDE7EE" />
<rect x="640" y="562" width="120" height="4" rx="2" fill="#635BFF" />
<text x="640" y="596" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Progress line: 4 px high, track #DDE7EE, fill #635BFF (here 1/3).</text>
<text x="640" y="614" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Disabled look while pending: grey fill, #9FA6AD label.</text>
<text x="640" y="644" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >Other controls in the same screen are disabled with the same look.</text>
<text x="640" y="662" font-size="11" font-weight="400" fill="#636B74" text-anchor="start" >The button text names the work in progress; it is not a spinner.</text></svg>
