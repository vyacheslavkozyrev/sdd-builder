<text x="56" y="600" font-size="14" font-weight="500" fill="#32383E" text-anchor="start" >Compact confirmation: anatomy</text>
<text x="56" y="630" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Width 400 px. Padding 24 px on all sides. Border 1 px #CDD7E1. Radius 12 px. Card shadow.</text>
<text x="56" y="652" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Title 24 px 500 #32383E, baseline 46 px below the dialog top (H5).</text>
