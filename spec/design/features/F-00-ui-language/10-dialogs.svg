<text x="56" y="696" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Button pair 120 × 40, radius 8, 16 px apart, centred under the text.</text>
<text x="56" y="718" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Cancel: white with #CDD7E1 edge. Danger: #BB241A fill, white 14 px 500 label.</text>
<text x="56" y="740" font-size="12" font-weight="400" fill="#32383E" text-anchor="start" >Scrim: #32383E at 35% over the whole screen. The dimmed screen stays visible.</text></svg>
