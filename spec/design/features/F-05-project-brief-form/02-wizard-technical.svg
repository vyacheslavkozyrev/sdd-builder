<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
    .muted{fill:#71717a;font-size:12px}
    .small{fill:#71717a;font-size:11px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .input{fill:#ffffff;stroke:#a1a1aa}
    .box{fill:#fafafa;stroke:#e4e4e7}
    .btn{fill:#ffffff;stroke:#d4d4d8}
    .primary{fill:#2563eb}
    .onPrimary{fill:#ffffff;font-weight:600}
    .file{fill:#f4f4f5;stroke:#d4d4d8}
    .stepOn{fill:#2563eb}
    .stepDone{fill:#dbeafe;stroke:#2563eb}
    .stepTodo{fill:#ffffff;stroke:#a1a1aa}
    .rule{stroke:#2563eb;stroke-width:1.5}
    .ruleTodo{stroke:#d4d4d8;stroke-width:1.5}
  </style>

  <rect width="1280" height="800" fill="#fafafa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="24" y="34" class="h1">SDDBuilder</text>
  <text x="170" y="34" class="muted">New project · Claude Code</text>

  <!-- Stepper: 4 steps, step 2 is current, step 1 done -->
  <line x1="276" y1="92" x2="504" y2="92" class="rule"/>
  <line x1="536" y1="92" x2="764" y2="92" class="ruleTodo"/>
  <line x1="796" y1="92" x2="1024" y2="92" class="ruleTodo"/>
  <rect x="282" y="80" width="182" height="24" fill="#fafafa"/>
  <rect x="542" y="80" width="122" height="24" fill="#fafafa"/>
  <rect x="802" y="80" width="80" height="24" fill="#fafafa"/>
  <rect x="1062" y="80" width="166" height="24" fill="#fafafa"/>
  <circle cx="260" cy="92" r="16" class="stepDone"/><text x="256" y="97" class="h2">✓</text>
  <text x="286" y="97" class="muted">Project name and idea</text>
  <circle cx="520" cy="92" r="16" class="stepOn"/><text x="516" y="97" class="onPrimary">2</text>
  <text x="546" y="97" class="h2">Technical details</text>
  <circle cx="780" cy="92" r="16" class="stepTodo"/><text x="776" y="97" class="muted">3</text>
  <text x="806" y="97" class="muted">Workflow</text>
  <circle cx="1040" cy="92" r="16" class="stepTodo"/><text x="1036" y="97" class="muted">4</text>
  <text x="1066" y="97" class="muted">Analyze and generate</text>

  <!-- Step card -->
  <rect x="120" y="130" width="1040" height="570" rx="10" class="panel"/>

  <!-- Left column: architecture and tech stack -->
  <text x="152" y="172" class="h2">Architecture and tech stack</text>
  <text x="152" y="194" class="muted">Step 2 of 4. Only what the generated project needs to know. No module list.</text>

  <text x="152" y="230" class="muted">Architecture style</text>
  <rect x="152" y="238" width="420" height="36" rx="6" class="input"/>
  <text x="166" y="261">Layered, with the generator core pure</text>

  <text x="152" y="306" class="muted">Language</text>
  <rect x="152" y="314" width="200" height="36" rx="6" class="input"/>
  <text x="166" y="337">TypeScript</text>
  <text x="372" y="306" class="muted">Framework</text>
  <rect x="372" y="314" width="200" height="36" rx="6" class="input"/>
  <text x="386" y="337">React</text>

  <text x="152" y="382" class="muted">Test framework</text>
  <rect x="152" y="390" width="200" height="36" rx="6" class="input"/>
  <text x="166" y="413">Vitest</text>
  <text x="372" y="382" class="muted">Build tool</text>
  <rect x="372" y="390" width="200" height="36" rx="6" class="input"/>
  <text x="386" y="413">Vite</text>

  <text x="152" y="462" class="small">Leave a field empty when it does not apply. Empty fields are left out of the project.</text>

  <!-- Right column: code rules, one block per file -->
  <text x="632" y="172" class="h2">Code rules</text>
  <text x="632" y="194" class="muted">Each rule block becomes its own Markdown file in the generated project.</text>

  <rect x="632" y="210" width="488" height="128" rx="8" class="box"/>
  <rect x="646" y="222" width="280" height="30" rx="6" class="input"/>
  <text x="658" y="242">Code style</text>
  <rect x="936" y="222" width="168" height="26" rx="6" class="file"/>
  <text x="946" y="240" class="small">rules/code-style.md</text>
  <text x="646" y="278">Use early returns. No default exports.</text>
  <text x="646" y="298">Keep functions under 40 lines.</text>
  <text x="1040" y="320" class="small">Remove block</text>

  <rect x="632" y="350" width="488" height="128" rx="8" class="box"/>
  <rect x="646" y="362" width="280" height="30" rx="6" class="input"/>
  <text x="658" y="382">Error handling</text>
  <rect x="936" y="362" width="168" height="26" rx="6" class="file"/>
  <text x="946" y="380" class="small">rules/error-handling.md</text>
  <text x="646" y="418">Throw for programmer errors.</text>
  <text x="646" y="438">Return findings for user errors. Never swallow an error.</text>
  <text x="1040" y="460" class="small">Remove block</text>

  <rect x="632" y="490" width="488" height="110" rx="8" class="box"/>
  <rect x="646" y="502" width="280" height="30" rx="6" class="input"/>
  <text x="658" y="522">Testing</text>
  <rect x="936" y="502" width="168" height="26" rx="6" class="file"/>
  <text x="946" y="520" class="small">rules/testing.md</text>
  <text x="646" y="558">Every task adds the tests for its own code.</text>
  <text x="1040" y="580" class="small">Remove block</text>

  <rect x="632" y="612" width="170" height="30" rx="6" class="btn"/>
  <text x="650" y="632">+ Add rule block</text>

  <!-- Footer -->
  <rect x="152" y="650" width="110" height="38" rx="6" class="btn"/>
  <text x="192" y="674">Back</text>
  <rect x="1000" y="650" width="110" height="38" rx="6" class="primary"/>
  <text x="1038" y="674" class="onPrimary">Next</text>
  <text x="152" y="716" class="small">A rule block needs a title. The file name is taken from the title and shown before you save.</text>
</svg>
