<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
    .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#18181b}
    .monoMuted{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#71717a}
    .muted{fill:#71717a;font-size:12px}
    .small{fill:#71717a;font-size:11px}
    .h1{font-size:18px;font-weight:600}
    .h2{font-size:14px;font-weight:600}
    .panel{fill:#ffffff;stroke:#e4e4e7}
    .box{fill:#f4f4f5;stroke:#e4e4e7}
    .btn{fill:#ffffff;stroke:#d4d4d8}
    .off{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
    .primary{fill:#2563eb}
    .onPrimary{fill:#ffffff;font-weight:600}
    .check{fill:#2563eb;stroke:#2563eb}
    .checkBox{fill:#ffffff;stroke:#71717a;stroke-width:1.5}
    .warn{fill:#fffbeb;stroke:#f59e0b}
    .info{fill:#dbeafe;stroke:#2563eb}
    .tagRule{fill:#fff7ed;stroke:#ea580c}
    .stepOn{fill:#2563eb}
    .stepDone{fill:#dbeafe;stroke:#2563eb}
    .stepTodo{fill:#ffffff;stroke:#a1a1aa}
    .rule{stroke:#2563eb;stroke-width:1.5}
  </style>

  <rect width="1280" height="800" fill="#fafafa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" class="panel"/>
  <text x="24" y="34" class="h1">SDDBuilder</text>
  <text x="170" y="34" class="muted">New project · Claude Code</text>

  <!-- Stepper: 4 steps, step 4 is current, steps 1 to 3 done -->
  <line x1="276" y1="92" x2="504" y2="92" class="rule"/>
  <line x1="536" y1="92" x2="764" y2="92" class="rule"/>
  <line x1="796" y1="92" x2="1024" y2="92" class="rule"/>
  <rect x="282" y="80" width="182" height="24" fill="#fafafa"/>
  <rect x="542" y="80" width="122" height="24" fill="#fafafa"/>
  <rect x="802" y="80" width="80" height="24" fill="#fafafa"/>
  <rect x="1062" y="80" width="166" height="24" fill="#fafafa"/>
  <circle cx="260" cy="92" r="16" class="stepDone"/><text x="256" y="97" class="h2">✓</text>
  <text x="286" y="97" class="muted">Project name and idea</text>
  <circle cx="520" cy="92" r="16" class="stepDone"/><text x="516" y="97" class="h2">✓</text>
  <text x="546" y="97" class="muted">Technical details</text>
  <circle cx="780" cy="92" r="16" class="stepDone"/><text x="776" y="97" class="h2">✓</text>
  <text x="806" y="97" class="muted">Workflow</text>
  <circle cx="1040" cy="92" r="16" class="stepOn"/><text x="1036" y="97" class="onPrimary">4</text>
  <text x="1066" y="97" class="h2">Analyze and generate</text>

  <!-- Left: analyze -->
  <rect x="40" y="130" width="600" height="560" rx="10" class="panel"/>
  <text x="64" y="172" class="h2">Analyze the brief</text>
  <text x="64" y="194" class="muted">Step 4 of 4. The structure is checked first, then a model reviews the brief.</text>

  <rect x="64" y="210" width="552" height="90" rx="8" class="box"/>
  <text x="80" y="234">Project: Demo project</text>
  <text x="80" y="256" class="muted">Architecture: Layered, with the generator core pure</text>
  <text x="80" y="276" class="muted">Stack: TypeScript · React · Vitest · Vite</text>
  <text x="80" y="296" class="muted">Code rules: 3 blocks, each one file · Workflows: 4 · Connections: 3</text>

  <rect x="64" y="316" width="552" height="60" rx="8" class="box"/>
  <text x="80" y="340">The brief is sent to the review service. The server does not keep</text>
  <text x="80" y="360">or log the brief content.</text>

  <rect x="64" y="390" width="18" height="18" rx="3" class="check"/>
  <text x="66" y="404" class="onPrimary">✓</text>
  <text x="92" y="404">I understand, send the brief for review</text>

  <rect x="64" y="424" width="140" height="36" rx="6" class="primary"/>
  <text x="104" y="447" class="onPrimary">Analyze</text>

  <text x="64" y="496" class="h2">Findings</text>
  <text x="64" y="516" class="small">0 blockers · 1 warning · 1 info · review ran: ok</text>

  <rect x="64" y="530" width="72" height="22" rx="11" class="warn"/>
  <text x="76" y="545" class="small">warning</text>
  <text x="150" y="545" class="h2">review · retry to implement</text>
  <text x="150" y="564" class="muted">The retry has no round limit. Each round can cost a model call.</text>
  <text x="150" y="582" class="small">Set a round limit on the review condition, or accept the cost.</text>

  <rect x="64" y="602" width="72" height="22" rx="11" class="info"/>
  <text x="80" y="617" class="small">info</text>
  <text x="150" y="617" class="h2">Review</text>
  <text x="150" y="636" class="muted">The review ran. No blockers were found.</text>

  <text x="64" y="668" class="small">Findings are listed as the analyzer returns them. The brief is not stored after analysis.</text>

  <!-- Right: generate -->
  <rect x="660" y="130" width="580" height="560" rx="10" class="panel"/>
  <text x="684" y="172" class="h2">Generate the project</text>
  <text x="684" y="194" class="muted">Creates the Claude Code files from the brief and the workflows.</text>

  <rect x="684" y="210" width="150" height="36" rx="6" class="primary"/>
  <text x="724" y="233" class="onPrimary">Generate</text>
  <text x="850" y="233" class="muted">Not generated yet.</text>

  <rect x="684" y="262" width="532" height="318" rx="8" class="box"/>
  <text x="700" y="288" class="mono">demo-project/</text>
  <text x="700" y="310" class="mono">├ CLAUDE.md</text>
  <text x="700" y="332" class="mono">├ .claude/</text>
  <text x="700" y="352" class="monoMuted">│  ├ commands/  pipeline.md, and one file per flow (6)</text>
  <text x="700" y="370" class="monoMuted">│  └ agents/    specify · plan · ux · implement · review · test · commit · verify · complete</text>
  <text x="700" y="392" class="mono">├ rules/</text>
  <text x="700" y="414" class="mono">│  ├ code-style.md</text>
  <rect x="1000" y="400" width="200" height="20" rx="10" class="tagRule"/>
  <text x="1012" y="414" class="small">from rule block "Code style"</text>
  <text x="700" y="436" class="mono">│  ├ error-handling.md</text>
  <rect x="1000" y="422" width="200" height="20" rx="10" class="tagRule"/>
  <text x="1012" y="436" class="small">from rule block "Error handling"</text>
  <text x="700" y="458" class="mono">│  └ testing.md</text>
  <rect x="1000" y="444" width="200" height="20" rx="10" class="tagRule"/>
  <text x="1012" y="458" class="small">from rule block "Testing"</text>
  <text x="700" y="480" class="mono">└ spec/</text>
  <text x="700" y="502" class="monoMuted">   ├ documents/</text>
  <text x="700" y="522" class="monoMuted">   └ specifications/F-00-template/</text>
  <text x="700" y="556" class="small">Files from the workflows are listed when the tree is generated.</text>

  <text x="684" y="606" class="small">The generated project is self-contained. It does not refer to SDDBuilder files.</text>

  <!-- Footer -->
  <rect x="40" y="706" width="110" height="36" rx="6" class="btn"/>
  <text x="80" y="729">Back</text>
  <rect x="1060" y="706" width="180" height="36" rx="6" class="off"/>
  <text x="1094" y="729" class="muted">Download zip</text>
  <text x="200" y="729" class="small">Download zip is enabled after generation. The zip holds exactly the files in the tree.</text>
</svg>
