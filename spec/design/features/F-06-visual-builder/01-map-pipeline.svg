.lineSel{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrB)}
.errLine{stroke:#dc2626;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#arrR)}
.dragLine{stroke:#2563eb;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.retry{stroke:#ea580c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#retry)}
.warnT{fill:#b45309;font-size:11px}
.errT{fill:#991b1b;font-size:12px}
.errS{fill:#991b1b;font-size:11px}
.btn{fill:#ffffff;stroke:#d4d4d8}
.primary{fill:#2563eb}
.danger{fill:#dc2626}
.onPrimary{fill:#ffffff;font-weight:600}
.off{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
.alert{fill:#fef2f2;stroke:#dc2626}
.warnBox{fill:#fffbeb;stroke:#f59e0b}
.inErr{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
.seg{fill:#ffffff;stroke:#d4d4d8}
.segOn{fill:#2563eb}
.dropT{fill:#eff6ff;stroke:#2563eb;stroke-dasharray:4 3;stroke-width:1.5}
.ghost{fill:#ffffff;stroke:#2563eb;stroke-dasharray:4 3;stroke-width:1.5}
.chip{fill:#f4f4f5;stroke:#d4d4d8}
.dim{fill:#18181b;opacity:0.12}
.dialog{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
.tab{fill:#f4f4f5}
.tabOn{fill:#2563eb}
