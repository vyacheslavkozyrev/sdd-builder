<text x="32" y="316" class="small">a Check onto a</text>
<text x="32" y="332" class="small">connection between</text>
<text x="32" y="348" class="small">two flows. Or select</text>
<text x="32" y="364" class="small">the connection and add</text>
<text x="32" y="380" class="small">one from its panel.</text>
<text x="32" y="412" class="small">+ adds a flow after</text>
<text x="32" y="428" class="small">the last tab.</text>
