<text x="378" y="192" class="tiny">#2</text>
<text x="524" y="192" class="tiny">#3</text>
<text x="670" y="192" class="tiny">#4</text>
<text x="816" y="192" class="tiny">#5</text>
<text x="232" y="332" class="tiny">#6</text>
<text x="378" y="332" class="tiny">#7</text>
<text x="524" y="332" class="tiny">#8</text>
<text x="702" y="332" class="tiny">#9</text>
<line x1="320" y1="230" x2="378" y2="230" class="line"/>
<line x1="498" y1="230" x2="524" y2="230" class="line"/>
<line x1="644" y1="230" x2="670" y2="230" class="line"/>
<line x1="790" y1="230" x2="816" y2="230" class="line"/>
<line x1="352" y1="370" x2="378" y2="370" class="line"/>
<line x1="498" y1="370" x2="524" y2="370" class="line"/>
