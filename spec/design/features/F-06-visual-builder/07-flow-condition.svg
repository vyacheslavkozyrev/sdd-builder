<text x="42" y="320" class="tiny">artifact handed over</text>
<rect x="32" y="340" width="148" height="46" rx="6" class="box"/>
<text x="42" y="359" class="bold">End</text>
<text x="42" y="376" class="tiny">done or stopped</text>
<text x="32" y="500" class="muted">Selected block</text>
<rect x="32" y="512" width="148" height="28" rx="6" class="btn"/>
<text x="106" y="530" text-anchor="middle">Move up</text>
