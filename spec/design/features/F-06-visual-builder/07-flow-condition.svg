<text x="292" y="420" text-anchor="middle" class="tiny">fail: back to implement</text>
<text x="438" y="420" text-anchor="middle" class="tiny">fail: stop</text>
<text x="228" y="470" class="small">Connections join two blocks of this flow only; other flows are not offered.</text>
<text x="228" y="485" class="small">A fail route goes to the next block, to an earlier block of this flow, or stops.</text>
<text x="228" y="660" class="tiny">Selected: review (block #4), a Condition with check type checks.</text>
<text x="980" y="100" class="h2">Condition: review</text>
<text x="980" y="116" class="tiny">Block #4 in build. Decided by an agent.</text>
<text x="980" y="140" class="muted">Check type</text>
<rect x="980.0" y="146" width="89.3" height="28" class="seg"/>
<text x="1024.7" y="164.0" text-anchor="middle">approval</text>
<rect x="1069.3" y="146" width="89.3" height="28" class="segOn"/>
<text x="1114.0" y="164.0" text-anchor="middle" class="onPrimary">checks</text>
<rect x="1158.7" y="146" width="89.3" height="28" class="seg"/>
<text x="1203.3" y="164.0" text-anchor="middle">diff-size</text>
<text x="980" y="196" class="muted">Decided by</text>
