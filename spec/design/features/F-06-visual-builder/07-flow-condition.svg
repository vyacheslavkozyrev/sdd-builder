<text x="42" y="152" class="tiny">entry of the flow</text>
<rect x="32" y="172" width="148" height="46" rx="6" class="box"/>
<text x="42" y="191" class="bold">Agent</text>
<text x="42" y="208" class="tiny">runs an agent</text>
<rect x="32" y="228" width="148" height="46" rx="6" class="box"/>
<text x="42" y="247" class="bold">Condition</text>
<text x="42" y="264" class="tiny">check with pass and fail</text>
<rect x="32" y="284" width="148" height="46" rx="6" class="box"/>
