<rect x="524" y="340" width="120" height="60" rx="8" class="node"/>
<text x="534" y="364" class="bold">commit</text>
<text x="534" y="382" class="tiny">agent · task</text>
<circle cx="730" cy="370" r="28" class="endc"/>
