<text x="990" y="220.0">agent (fixed for checks)</text>
<text x="980" y="246" class="muted">Description (required)</text>
<rect x="980" y="252" width="268" height="48" rx="6" class="box"/>
<text x="990" y="272" class="small">The review reports no blocker</text>
<text x="990" y="288" class="small">or warning.</text>
<text x="980" y="322" class="muted">Pass route</text>
<rect x="980" y="328" width="268" height="28" rx="6" class="box"/>
<text x="990" y="346.0">test (next block)</text>
<text x="980" y="368" class="muted">Fail route</text>
<rect x="980.0" y="374" width="89.3" height="28" class="seg"/>
<text x="1024.7" y="392.0" text-anchor="middle">next</text>
<rect x="1069.3" y="374" width="89.3" height="28" class="segOn"/>
<text x="1114.0" y="392.0" text-anchor="middle" class="onPrimary">back</text>
<rect x="1158.7" y="374" width="89.3" height="28" class="seg"/>
<text x="1203.3" y="392.0" text-anchor="middle">stop</text>
<text x="980" y="414" class="muted">Back to</text>
<rect x="980" y="420" width="268" height="28" rx="6" class="box"/>
<text x="990" y="438.0">implement (earlier block)</text>
<text x="980" y="462" class="muted">Round limit (optional)</text>
<rect x="980" y="468" width="268" height="28" rx="6" class="box"/>
<text x="990" y="486" class="tiny">none set: empty for no limit; else 1 or more</text>
<rect x="980" y="504" width="268" height="44" rx="6" class="warnBox"/>
<text x="990" y="521" class="warnT">No round limit: each round costs a model</text>
<text x="990" y="536" class="warnT">call. The analyzer warns about it.</text>
<text x="980" y="572" class="tiny">Routes offered: the next block, an earlier block</text>
<text x="980" y="586" class="tiny">of this flow, or stop. Later blocks and other</text>
