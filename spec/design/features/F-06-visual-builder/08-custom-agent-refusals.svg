<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#71717a"/></marker><marker id="retry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/></marker><marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker><marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
.muted{fill:#71717a;font-size:12px}
.small{fill:#71717a;font-size:11px}
.tiny{fill:#71717a;font-size:10px}
.bold{font-weight:600;font-size:12px}
.h1{font-size:18px;font-weight:600}
.h2{font-size:14px;font-weight:600}
.panel{fill:#ffffff;stroke:#e4e4e7}
.node{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
