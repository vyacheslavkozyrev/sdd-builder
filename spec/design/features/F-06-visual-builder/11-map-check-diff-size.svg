<text x="580" y="286" text-anchor="middle" class="tiny">plan.md</text>
<polygon points="704,207 715,218 704,229 693,218" class="gateSel"/>
<text x="704" y="270" text-anchor="middle" class="tiny">diff-size · agent</text>
<text x="704" y="286" text-anchor="middle" class="tiny">line threshold</text>
<polygon points="828,207 839,218 828,229 817,218" class="gate"/>
<text x="828" y="270" text-anchor="middle" class="tiny">approval · human</text>
<text x="828" y="286" text-anchor="middle" class="tiny">checklist</text>
<text x="228" y="660" class="tiny">Diamond: gate or check on an arrow · Arrow: connection · Box: flow · Dashed: switched off</text>
<text x="980" y="100" class="h2">Check: build → verify</text>
<text x="980" y="116" class="tiny">Condition on a connection between flows.</text>
<text x="980" y="140" class="muted">Check type</text>
<rect x="980.0" y="146" width="134.0" height="28" class="seg"/>
<text x="1047.0" y="164.0" text-anchor="middle">checks</text>
<rect x="1114.0" y="146" width="134.0" height="28" class="segOn"/>
<text x="1181.0" y="164.0" text-anchor="middle" class="onPrimary">diff-size</text>
<text x="980" y="194" class="muted">Decided by</text>
<rect x="980" y="200" width="268" height="28" rx="6" class="box"/>
<text x="990" y="218">agent (fixed)</text>
<text x="980" y="246" class="muted">Description (required)</text>
<rect x="980" y="252" width="268" height="40" rx="6" class="box"/>
<text x="990" y="270" class="small">the change stays within the line limit</text>
<text x="980" y="310" class="muted">Threshold (lines)</text>
<rect x="980" y="316" width="268" height="26" rx="6" class="inErr"/>
<text x="990" y="333">0</text>
<text x="980" y="356" class="errS">Whole number of lines, 1 or more.</text>
<text x="980" y="380" class="muted">Pass route</text>
<rect x="980" y="386" width="268" height="26" rx="6" class="box"/>
<text x="990" y="403">verify (next flow)</text>
<text x="980" y="428" class="muted">Fail route</text>
<rect x="980.0" y="434" width="134.0" height="28" class="segOn"/>
<text x="1047.0" y="452" text-anchor="middle" class="onPrimary">stop</text>
<rect x="1114.0" y="434" width="134.0" height="28" class="seg"/>
<text x="1181.0" y="452" text-anchor="middle">back</text>
<text x="980" y="476" class="tiny">back: pick an earlier flow and an optional round limit</text>
<rect x="980" y="492" width="268" height="64" rx="6" class="warnBox"/>
<text x="990" y="510" class="warnT">Review is not a check type. A review is an</text>
<text x="990" y="525" class="warnT">Agent block in a flow; a Condition after it</text>
<text x="990" y="540" class="warnT">checks the result.</text>
<text x="980" y="572" class="tiny">Approval is a separate Map item, decided by a</text>
<text x="980" y="586" class="tiny">person; a Check is decided by an agent.</text>
</svg>
