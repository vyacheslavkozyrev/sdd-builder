<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#71717a"/></marker><marker id="retry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/></marker><marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker><marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#18181b;font-size:13px}
.muted{fill:#71717a;font-size:12px}
.small{fill:#71717a;font-size:11px}
.tiny{fill:#71717a;font-size:10px}
.bold{font-weight:600;font-size:12px}
.h1{font-size:18px;font-weight:600}
.h2{font-size:14px;font-weight:600}
.panel{fill:#ffffff;stroke:#e4e4e7}
.node{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
.nodeSel{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}
.nodeWarn{fill:#ffffff;stroke:#dc2626;stroke-width:2}
.nodeOff{fill:#fafafa;stroke:#a1a1aa;stroke-width:1.5;stroke-dasharray:5 4}
.gate{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
.gateSel{fill:#fff7ed;stroke:#2563eb;stroke-width:2.5}
.box{fill:#f4f4f5;stroke:#d4d4d8}
.start{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}
.endc{fill:#ffffff;stroke:#18181b;stroke-width:3}
.line{stroke:#71717a;stroke-width:1.5;fill:none;marker-end:url(#arr)}
.lineSel{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrB)}
.errLine{stroke:#dc2626;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#arrR)}
.dragLine{stroke:#2563eb;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.retry{stroke:#ea580c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#retry)}
.warnT{fill:#b45309;font-size:11px}
.errT{fill:#991b1b;font-size:12px}
.errS{fill:#991b1b;font-size:11px}
.btn{fill:#ffffff;stroke:#d4d4d8}
.primary{fill:#2563eb}
.danger{fill:#dc2626}
.onPrimary{fill:#ffffff;font-weight:600}
.off{fill:#fafafa;stroke:#a1a1aa;stroke-dasharray:5 4}
.alert{fill:#fef2f2;stroke:#dc2626}
.warnBox{fill:#fffbeb;stroke:#f59e0b}
.inErr{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
.seg{fill:#ffffff;stroke:#d4d4d8}
.segOn{fill:#2563eb}
.dropT{fill:#eff6ff;stroke:#2563eb;stroke-dasharray:4 3;stroke-width:1.5}
.ghost{fill:#ffffff;stroke:#2563eb;stroke-dasharray:4 3;stroke-width:1.5}
.chip{fill:#f4f4f5;stroke:#d4d4d8}
.dim{fill:#18181b;opacity:0.12}
.dialog{fill:#ffffff;stroke:#18181b;stroke-width:1.5}
.tab{fill:#f4f4f5}
.tabOn{fill:#2563eb}
</style>
