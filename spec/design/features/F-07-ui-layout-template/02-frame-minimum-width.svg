<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#32383E" flood-opacity="0.12"/></filter>
</defs>
<style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:#32383E}
.brand{font-size:18px;font-weight:500}
.btnText{font-size:14px;font-weight:500;fill:#FFFFFF}
.navT{font-size:13px;font-weight:500}
.navOff{font-size:13px;font-weight:500;fill:#9FA6AD}
.h2{font-size:14px;font-weight:500}
.muted{font-size:12px;fill:#636B74}
.caption{font-size:11px;fill:#636B74}
.label-cur{font-size:13px;font-weight:500;fill:#635BFF}
.label-todo{font-size:12px;font-weight:500;fill:#636B74}
.num{font-size:12px;font-weight:500;fill:#FFFFFF}
.num-todo{font-size:12px;font-weight:500;fill:#636B74}
.div{stroke:#DDE7EE;stroke-width:1}
.card{fill:#FFFFFF;stroke:#DDE7EE}
.btnP{fill:#635BFF}
.btnOff{fill:#F0F4F8;stroke:#DDE7EE}
.ring{fill:none;stroke:#DDE3FF;stroke-width:4}
.node-todo{fill:#FFFFFF;stroke:#CDD7E1;stroke-width:1.5}
.node-cur{fill:#635BFF}
.line-todo{stroke:#CDD7E1;stroke-width:2}
.scroll{fill:#DDE7EE}
.thumb{fill:#9FA6AD}
</style>
<rect width="1024" height="768" fill="#F0F4F8"/>

<!-- Left panel: stays at 260 px at the minimum width -->
<rect x="0" y="0" width="260" height="744" fill="#FFFFFF"/>
<rect x="259" y="0" width="1" height="744" fill="#DDE7EE"/>
<rect x="24" y="24" width="24" height="24" rx="6" fill="#635BFF"/>
<text x="58" y="42" class="brand">SDDBuilder</text>
<rect x="24" y="72" width="212" height="40" rx="8" class="btnP"/>
<text x="130" y="97" class="btnText" text-anchor="middle">New project</text>

<!-- Vertical stepper: step 1 is the current step -->
<line x1="40" y1="186" x2="40" y2="216" class="line-todo"/>
<line x1="40" y1="240" x2="40" y2="280" class="line-todo"/>
<line x1="40" y1="304" x2="40" y2="344" class="line-todo"/>
<circle class="ring" cx="40" cy="164" r="18"/><circle class="node-cur" cx="40" cy="164" r="12"/>
<text class="num" x="40" y="168.5" text-anchor="middle">1</text>
<text class="label-cur" x="64" y="168">Project</text>
<circle class="node-todo" cx="40" cy="228" r="12"/><text class="num-todo" x="40" y="232.5" text-anchor="middle">2</text>
<text class="label-todo" x="64" y="232">Technical details</text>
<circle class="node-todo" cx="40" cy="292" r="12"/><text class="num-todo" x="40" y="296.5" text-anchor="middle">3</text>
<text class="label-todo" x="64" y="296">Workflow</text>
<circle class="node-todo" cx="40" cy="356" r="12"/><text class="num-todo" x="40" y="360.5" text-anchor="middle">4</text>
<text class="label-todo" x="64" y="360">Analyze and generate</text>

<!-- Prev and Next sit at the foot of the panel, 24 px above the scrollbar strip -->
<g><title>Prev: disabled on step 1</title><rect class="btnOff" x="24" y="680" width="100" height="40" rx="8"/><text class="navOff" x="74" y="704" text-anchor="middle">Prev</text></g>
<g><title>Next: go to the next step</title><rect class="btnP" x="136" y="680" width="100" height="40" rx="8"/><text class="btnText" x="186" y="704" text-anchor="middle">Next</text></g>

<!-- Content area: takes the rest of the width (284 to 1000, 24 px gutters) -->
<rect x="284" y="24" width="716" height="656" rx="12" class="card" filter="url(#sh)"/>
<text x="642" y="354" class="h2" text-anchor="middle">Centre area: the screen content</text>
<text x="642" y="378" class="muted" text-anchor="middle">Same frame at the 1024 px minimum width</text>

<!-- Footer note and caption: inside the grey area, 24 px below the cards -->
<text x="284" y="716" class="muted">The work is not saved. It is lost when the browser is refreshed.</text>
<text x="1000" y="716" class="caption" text-anchor="end">F-07 · screen 2 · 1024 × 768</text>

<!-- Horizontal scrollbar: illustration only; it appears only in a window narrower than 1024 px -->
<rect class="scroll" x="0" y="744" width="1024" height="24"/>
<rect class="thumb" x="24" y="749" width="300" height="14" rx="7"/>
<text class="caption" x="1000" y="760" text-anchor="end">Scrollbar appears only in a window narrower than 1024 px; the page scrolls horizontally, no reflow</text>
</svg>
