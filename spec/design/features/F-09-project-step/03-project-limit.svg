<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#32383E" flood-opacity="0.12"/></filter>
</defs>
<style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:#32383E}
.brand{font-size:18px;font-weight:500}
.btnText{font-size:14px;font-weight:500;fill:#FFFFFF}
.btnDark{font-size:14px;font-weight:500;fill:#32383E}
.navOff{font-size:14px;font-weight:500;fill:#9FA6AD}
.muted{font-size:12px;fill:#636B74}
.caption{font-size:11px;fill:#636B74}
.label-cur{font-size:13px;font-weight:500;fill:#635BFF}
.label-todo{font-size:12px;font-weight:500;fill:#636B74}
.num{font-size:12px;font-weight:500;fill:#FFFFFF}
.num-todo{font-size:12px;font-weight:500;fill:#636B74}
.field-label{font-size:12px;font-weight:500;fill:#32383E}
.req{fill:#DE3024}
.field-help{font-size:12px;fill:#636B74}
.field-text{font-size:13px;fill:#32383E}
.field-ph{font-size:13px;fill:#636B74}
.counter{font-size:12px;fill:#636B74}
.warnT{font-size:12px;font-weight:500;fill:#B84D05}
.btnP{fill:#635BFF}
.btn{fill:#FFFFFF;stroke:#CDD7E1}
.btnOff{fill:#F0F4F8;stroke:#DDE7EE}
.ring{fill:none;stroke:#DDE3FF;stroke-width:4}
.node-todo{fill:#FFFFFF;stroke:#CDD7E1;stroke-width:1.5}
.node-cur{fill:#635BFF}
.line-todo{stroke:#CDD7E1;stroke-width:2}
.card{fill:#FFFFFF;stroke:#DDE7EE}
.input{fill:#FFFFFF;stroke:#CDD7E1}
.warnBox{fill:#FFFAEA;stroke:#FCD34D}
</style>
<rect width="1280" height="800" fill="#F0F4F8"/>

<!-- Left panel: wordmark, New project, vertical stepper, Prev and Next at the foot (F-08 frame) -->
<rect x="0" y="0" width="260" height="800" fill="#FFFFFF"/>
<rect x="259" y="0" width="1" height="800" fill="#DDE7EE"/>
<rect x="24" y="24" width="24" height="24" rx="6" fill="#635BFF"/>
<text x="58" y="42" class="brand">SDDBuilder</text>
<rect x="24" y="72" width="212" height="40" rx="8" class="btn"/>
<text x="130" y="97" class="btnDark" text-anchor="middle">New project</text>

<!-- Vertical stepper: step 1 is the current step; steps 2 to 4 are to do -->
<line x1="40" y1="184" x2="40" y2="208" class="line-todo"/>
<line x1="40" y1="248" x2="40" y2="272" class="line-todo"/>
<line x1="40" y1="312" x2="40" y2="336" class="line-todo"/>
<circle class="ring" cx="40" cy="164" r="18"/>
<circle class="node-cur" cx="40" cy="164" r="12"><title>Project: current step</title></circle>
<text class="num" x="40" y="168.5" text-anchor="middle">1</text>
<text class="label-cur" x="64" y="168">Project</text>
<circle class="node-todo" cx="40" cy="228" r="12"><title>Technical details: to do</title></circle>
<text class="num-todo" x="40" y="232.5" text-anchor="middle">2</text>
<text class="label-todo" x="64" y="232">Technical details</text>
<circle class="node-todo" cx="40" cy="292" r="12"><title>Workflow: to do</title></circle>
<text class="num-todo" x="40" y="296.5" text-anchor="middle">3</text>
<text class="label-todo" x="64" y="296">Workflow</text>
<circle class="node-todo" cx="40" cy="356" r="12"><title>Analyze and generate: to do</title></circle>
<text class="num-todo" x="40" y="360.5" text-anchor="middle">4</text>
<text class="label-todo" x="64" y="360">Analyze and generate</text>

<!-- Prev is disabled on step 1; Next is enabled -->
<g><title>Prev is not available on step 1</title><rect class="btnOff" x="24" y="728" width="100" height="40" rx="8"/><text class="navOff" x="74" y="752" text-anchor="middle">Prev</text></g>
<g><title>Next: go to the next step</title><rect class="btnP" x="136" y="728" width="100" height="40" rx="8"/><text class="btnText" x="186" y="752" text-anchor="middle">Next</text></g>

<!-- Content area: one white card; content at x 308 to 1232 (24 px padding) -->
<rect class="card" x="284" y="24" width="972" height="704" rx="12" filter="url(#sh)"/>

<text class="field-label" x="308" y="64">Project name<tspan class="req"> *</tspan></text>
<rect class="input" x="308" y="76" width="924" height="40" rx="8"/>
<text class="field-text" x="324" y="101">Hourly time tracker for freelancers: weekly totals, monthly invoices, client notes and hourly rates.</text>
<text class="warnT" x="308" y="136">100 characters: the limit is reached. Text past the limit is cut, also when pasted.</text>

<text class="field-label" x="308" y="176">Idea<tspan class="req"> *</tspan></text>
<rect class="input" x="308" y="188" width="924" height="200" rx="8"/>
<text class="field-text" x="324" y="212">A tracker for hourly work. Freelancers log time against clients,</text>
<text class="field-text" x="324" y="232">see weekly totals, and export a monthly summary for invoicing.</text>
<text class="field-ph" x="324" y="252">… the text continues up to 5,000 characters …</text>
<text class="warnT" x="1216" y="374" text-anchor="end">5,000 / 5,000</text>
<rect class="warnBox" x="308" y="396" width="924" height="34" rx="6"/>
<text class="warnT" x="324" y="418">The idea is at the limit of 5,000 characters. Text past it is cut, also when pasted.</text>
<text class="field-help" x="308" y="450">Describe what the product does and who uses it. Leave out how it is built.</text>
<text class="field-help" x="308" y="474">Nothing is stored between visits. Reloading clears the wizard.</text>

<!-- Footer note and caption: inside the grey area, 24 px below the card -->
<text x="284" y="766" class="muted">The work is not saved. It is lost when the browser is refreshed.</text>
<text x="1256" y="766" class="caption" text-anchor="end">F-09 · screen 3 · step 1 of 4 · 1280 × 800</text>
</svg>
