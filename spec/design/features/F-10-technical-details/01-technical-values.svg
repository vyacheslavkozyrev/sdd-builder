<!-- Content: one white card x 284-1256, y 24-728; content box x 308-1232 -->
<rect class="card" x="284" y="24" width="972" height="704" rx="12" filter="url(#sh)"/>
<text x="308" y="62" class="h2">Stack</text>
<text x="308" y="92" class="field-label">Language<tspan class="req"> *</tspan></text>
<rect x="308" y="104" width="208" height="40" rx="8" class="input"/>
<text x="320" y="129" class="field-text">TypeScript</text>
<text x="532" y="92" class="field-label">Framework</text>
<rect x="532" y="104" width="208" height="40" rx="8" class="input"/>
<text x="544" y="129" class="field-text">React</text>
<text x="308" y="164" class="field-label">Platform</text>
<rect x="308" y="176" width="208" height="40" rx="8" class="input"/>
<text x="320" y="201" class="field-text">Web browser</text>
<text x="532" y="164" class="field-label">Build tool</text>
<rect x="532" y="176" width="208" height="40" rx="8" class="input"/>
<text x="544" y="201" class="field-text">Vite</text>
<text x="308" y="236" class="field-label">Test framework</text>
<rect x="308" y="248" width="208" height="40" rx="8" class="input"/>
<text x="320" y="273" class="field-text">Vitest</text>
<text x="308" y="308" class="field-help">Language is required. The other four are optional.</text>
<text x="308" y="328" class="field-help">Up to 100 characters each; text past the limit is cut.</text>
<text x="308" y="368" class="field-label">Architecture (optional)</text>
<rect x="308" y="380" width="432" height="120" rx="8" class="input"/>
<text x="320" y="404" class="field-text">Three packages: core is pure, and the web app and the API</text>
<text x="320" y="424" class="field-text">depend on core only. The LLM is called from the API alone.</text>
<text x="308" y="520" class="field-help">Up to 5,000 characters. Text past the limit is cut, also when pasted.</text>
<line class="div" x1="772" y1="48" x2="772" y2="704"/>
<text x="788" y="62" class="h2">Rule blocks</text>
<text x="788" y="82" class="field-help">Each block becomes one file in .claude/rules/. The list starts empty.</text>
<rect x="1204" y="48" width="28" height="28" rx="6" class="btnOut"/>
<text x="1218" y="68" class="plusT" text-anchor="middle">+</text>
<rect x="788" y="96" width="444" height="224" rx="8" class="blk"/>
<text x="804" y="126" class="field-label">Rule block 1</text>
<g><title>Remove rule block 1</title><rect x="1188" y="108" width="28" height="28" rx="6" class="btnOut"/><rect x="1196" y="121" width="12" height="2" class="minusP"/></g>
<text x="804" y="152" class="field-label">Name<tspan class="req"> *</tspan></text>
<rect x="804" y="164" width="412" height="40" rx="8" class="input"/>
<text x="816" y="189" class="field-text">Code Style</text>
<text x="804" y="224" class="muted">File: .claude/rules/code-style.md</text>
<text x="804" y="252" class="field-label">Description</text>
<rect x="804" y="264" width="412" height="40" rx="8" class="input"/>
<text x="816" y="289" class="field-text">Use named exports. Keep one component per file.</text>
<rect x="788" y="332" width="444" height="224" rx="8" class="blk"/>
<text x="804" y="362" class="field-label">Rule block 2</text>
<g><title>Remove rule block 2</title><rect x="1188" y="344" width="28" height="28" rx="6" class="btnOut"/><rect x="1196" y="357" width="12" height="2" class="minusP"/></g>
<text x="804" y="388" class="field-label">Name<tspan class="req"> *</tspan></text>
<rect x="804" y="400" width="412" height="40" rx="8" class="input"/>
<text x="816" y="425" class="field-text">Testing</text>
<text x="804" y="460" class="muted">File: .claude/rules/testing.md</text>
<text x="804" y="488" class="field-label">Description</text>
<rect x="804" y="500" width="412" height="40" rx="8" class="input"/>
<text x="816" y="525" class="field-text">Every new function has a test in the same task.</text><text x="284" y="766" class="muted">The work is not saved. It is lost when the browser is refreshed.</text>
