<rect x="1092" y="246" width="88" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text class="muted-s" x="1136" y="263" text-anchor="middle">Remove</text>
<text class="field-label" x="688" y="288">Name<tspan class="req"> *</tspan></text>
<rect class="input" x="688" y="294" width="492" height="34" rx="8"/>
<text class="field-text" x="700" y="316">Code Style</text>
<text class="muted" x="688" y="346">File: .claude/rules/code-style.md</text>
<text class="warnT" x="688" y="364">Same file as rule block 2. Both are kept.</text>
<text class="field-label" x="688" y="388">Description</text>
<rect class="input" x="688" y="394" width="492" height="36" rx="8"/>
<text class="field-text" x="700" y="417">Use named exports. Keep one component per file.</text>
<rect x="672" y="448" width="524" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text class="field-label" x="688" y="475">Rule block 2</text>
<rect x="1092" y="458" width="88" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text class="muted-s" x="1136" y="475" text-anchor="middle">Remove</text>
<text class="field-label" x="688" y="500">Name<tspan class="req"> *</tspan></text>
<rect class="input" x="688" y="506" width="492" height="34" rx="8"/>
<text class="field-text" x="700" y="528">code style</text>
<text class="muted" x="688" y="558">File: .claude/rules/code-style.md</text>
<text class="warnT" x="688" y="576">Same file as rule block 1. Both are kept.</text>
<text class="field-label" x="688" y="600">Description</text>
<rect class="input" x="688" y="606" width="492" height="36" rx="8"/>
<text class="field-text" x="700" y="629">Use named exports. Keep one component per file.</text>
<rect x="960" y="668" width="248" height="36" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text class="nav-label" x="1084" y="691" text-anchor="middle">Add rule block</text>
<line class="div" x1="0" y1="752" x2="1280" y2="752"/>
<rect class="bar" x="0" y="752" width="1280" height="48"/>
<text class="muted" x="24" y="781">The work is not saved. It is lost when the browser is refreshed.</text>
<text class="caption" x="1256" y="781" text-anchor="end">F-10 · screen 03 · step 2 of 4 · duplicate ids flagged · 1280 × 800</text>
</svg>
