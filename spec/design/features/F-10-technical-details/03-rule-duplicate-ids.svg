<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:#0f172a}
.brand{font-size:15px;font-weight:700}
.bt-primary{fill:#ffffff;font-weight:600}
.muted{font-size:12px;fill:#64748b}
.caption{font-size:11px;fill:#64748b}
.ph{font-size:17px;font-weight:600;fill:#4338ca}
.label-done{font-size:12px;font-weight:600;fill:#047857}
.label-cur{font-size:13px;font-weight:700;fill:#3730a3}
.nav-label{font-size:12px;font-weight:600;fill:#4338ca}
.nav-label-dis{font-size:12px;font-weight:600;fill:#64748b}
.label-todo{font-size:12px;font-weight:500;fill:#475569}
.num{font-size:12px;font-weight:700;fill:#ffffff}
.num-todo{font-size:12px;font-weight:700;fill:#64748b}
.check{font-size:13px;font-weight:700;fill:#ffffff}
.field-label{font-size:12px;font-weight:600;fill:#334155}
.req{fill:#dc2626}
.field-help{font-size:11px;fill:#64748b}
.field-text{font-size:13px;fill:#0f172a}
.field-ph{font-size:13px;fill:#64748b}
.counter{font-size:11px;fill:#64748b}
.warnT{font-size:12px;font-weight:600;fill:#92400e}
.bar{fill:#ffffff}
.div{stroke:#e2e8f0;stroke-width:1}
.primary{fill:#2563eb}
.nav-on{fill:#ffffff;stroke:#6366f1;stroke-width:2}
.nav-dis{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1.5}
.arrow{fill:none;stroke:#4f46e5;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.arrow-dis{fill:none;stroke:#cbd5e1;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.arrow-w{fill:none;stroke:#ffffff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.node-todo{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
.node-cur{fill:#4f46e5}
.ring{fill:none;stroke:#c7d2fe;stroke-width:4}
.line-todo{stroke:#dbe3ee;stroke-width:4;stroke-linecap:round}
.line-done{stroke:#10b981;stroke-width:4;stroke-linecap:round}
.card{fill:#ffffff}
.input{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
.warnBox{fill:#fffbeb;stroke:#fcd34d;stroke-width:1}
.btnDanger{fill:#dc2626}
.muted-s{font-size:12px;fill:#334155}
.section{font-size:13px;font-weight:700;fill:#0f172a}
</style>
<defs>
  <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="gDone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
  <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.12"/></filter>
  <clipPath id="cardClip"><rect x="24" y="152" width="1232" height="584" rx="16"/></clipPath>
</defs>

<rect x="0" y="0" width="1280" height="800" fill="url(#gBg)"/>
<rect x="0" y="0" width="1280" height="800" fill="url(#gBg)"/>
<rect class="bar" x="0" y="0" width="1280" height="56"/>
<line class="div" x1="0" y1="56" x2="1280" y2="56"/>
<text class="brand" x="24" y="34">SDDBuilder</text>
<rect class="primary" x="1120" y="12" width="136" height="32" rx="6"/>
<text class="bt-primary" x="1188" y="33" text-anchor="middle">New project</text>
<!-- stepper row: step 1 done, step 2 current; Prev and Next enabled -->
<g>
  <title>Prev: go to the previous step</title>
  <circle class="nav-on" cx="72" cy="100" r="20"/>
  <path class="arrow" d="M75 92 L67 100 L75 108"/>
</g>
<text class="nav-label" x="72" y="132" text-anchor="middle">Prev</text>
<line class="line-done" x1="242" y1="100" x2="478" y2="100"/>
<line class="line-todo" x1="522" y1="100" x2="758" y2="100"/>
<line class="line-todo" x1="802" y1="100" x2="1038" y2="100"/>
<circle cx="220" cy="100" r="12" fill="url(#gDone)"><title>Project: done</title></circle>
<text class="check" x="220" y="104.5" text-anchor="middle">✓</text>
<text class="label-done" x="220" y="132" text-anchor="middle">Project</text>
<circle class="ring" cx="500" cy="100" r="18"/>
<circle class="node-cur" cx="500" cy="100" r="12"><title>Technical details: current step</title></circle>
<text class="num" x="500" y="104.5" text-anchor="middle">2</text>
<text class="label-cur" x="500" y="132" text-anchor="middle">Technical details</text>
<circle class="node-todo" cx="780" cy="100" r="12"><title>Workflow: to do</title></circle>
<text class="num-todo" x="780" y="104.5" text-anchor="middle">3</text>
<text class="label-todo" x="780" y="132" text-anchor="middle">Workflow</text>
<circle class="node-todo" cx="1060" cy="100" r="12"><title>Analyze and generate: to do</title></circle>
<text class="num-todo" x="1060" y="104.5" text-anchor="middle">4</text>
<text class="label-todo" x="1060" y="132" text-anchor="middle">Analyze and generate</text>
<g>
  <title>Next: go to the next step</title>
  <circle cx="1208" cy="100" r="20" fill="url(#gBrand)"/>
  <path class="arrow-w" d="M1205 92 L1213 100 L1205 108"/>
</g>
<text class="nav-label" x="1208" y="132" text-anchor="middle">Next</text>
<rect class="card" x="24" y="152" width="1232" height="584" rx="16" filter="url(#sh)"/>
<rect x="24" y="152" width="1232" height="6" fill="url(#gAccent)" clip-path="url(#cardClip)"/>
<text class="section" x="72" y="186">Stack</text>
<text class="field-label" x="72" y="208">Language<tspan class="req"> *</tspan></text>
<rect class="input" x="72" y="216" width="268" height="36" rx="8"/>
<text class="field-text" x="84" y="238.5">TypeScript</text>
<text class="field-label" x="360" y="208">Framework</text>
<rect class="input" x="360" y="216" width="260" height="36" rx="8"/>
<text class="field-text" x="372" y="238.5">React</text>
<text class="field-label" x="72" y="276">Platform</text>
<rect class="input" x="72" y="284" width="268" height="36" rx="8"/>
<text class="field-text" x="84" y="306.5">Web browser</text>
<text class="field-label" x="360" y="276">Build tool</text>
<rect class="input" x="360" y="284" width="260" height="36" rx="8"/>
<text class="field-text" x="372" y="306.5">Vite</text>
<text class="field-label" x="72" y="344">Test framework</text>
<rect class="input" x="72" y="352" width="268" height="36" rx="8"/>
<text class="field-text" x="84" y="374.5">Vitest</text>
<text class="field-help" x="72" y="404">Language is required. The other four are optional.</text>
<text class="field-help" x="72" y="420">Up to 100 characters each; text past the limit is cut.</text>
<text class="field-label" x="72" y="456">Architecture (optional)</text>
<rect class="input" x="72" y="464" width="548" height="120" rx="8"/>
<text class="field-text" x="84" y="488">Three packages: core is pure, and the web app and the API</text>
<text class="field-text" x="84" y="508">depend on core only. The LLM is called from the API alone.</text>
<text class="field-help" x="72" y="604">Up to 5,000 characters. Text past the limit is cut, also when pasted.</text>
<line class="div" x1="640" y1="186" x2="640" y2="716"/>
<text class="section" x="660" y="186">Rule blocks</text>
<text class="field-help" x="660" y="206">Each block becomes one file in .claude/rules/. The list starts empty.</text>
<rect x="660" y="228" width="548" height="428" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="672" y="236" width="524" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
