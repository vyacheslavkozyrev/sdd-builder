<text class="label-cur" x="64" y="296">Workflow</text>
<circle class="node-todo" cx="40" cy="356" r="12"/><text class="num-todo" x="40" y="360.5" text-anchor="middle">4</text>
<text class="label-todo" x="64" y="360">Analyze and generate</text>

<!-- Prev / Next -->
<g><title>Prev: go to the previous step</title><rect class="btn" x="24" y="988" width="100" height="40" rx="8"/><text class="navT" x="74" y="1012" text-anchor="middle">Prev</text></g>
