<rect x="284" y="24" width="85.2" height="32" rx="8" class="tabOn"/><text x="297" y="44" class="onP">Pipeline</text><rect x="377.2" y="24" width="77.8" height="32" rx="8" class="tab"/><text x="390.2" y="44" class="tabT">specify</text><rect x="463" y="24" width="60" height="32" rx="8" class="tab"/><text x="476" y="44" class="tabT">ux</text><rect x="531" y="24" width="60" height="32" rx="8" class="tab"/><text x="544" y="44" class="tabT">plan</text><rect x="599" y="24" width="63" height="32" rx="8" class="tab"/><text x="612" y="44" class="tabT">build</text><rect x="670" y="24" width="70.4" height="32" rx="8" class="tab"/><text x="683" y="44" class="tabT">verify</text><rect x="748.4" y="24" width="85.2" height="32" rx="8" class="tab"/><text x="761.4" y="44" class="tabT">complete</text><rect x="841.6" y="24" width="34" height="32" rx="8" class="btn"/><text x="852.6" y="45" class="plus">+</text><rect x="284" y="80" width="680" height="912" rx="12" class="card" filter="url(#sh)"/><text x="308" y="112" class="h2">Pipeline</text><text x="308" y="130" class="small">Flows in pipeline order, left to right. Select a flow to edit its artifacts, checks and Human approval.</text><g clip-path="url(#canvasClip)"><rect x="308" y="380" width="80" height="76" rx="8" class="node"/><text x="318" y="406" class="bold">specify</text><text x="318" y="426" class="small">3 blocks</text><rect x="418" y="380" width="80" height="76" rx="8" class="node"/><text x="428" y="406" class="bold">ux</text><text x="428" y="426" class="small">3 blocks</text><rect x="528" y="380" width="80" height="76" rx="8" class="node"/><text x="538" y="406" class="bold">plan</text><text x="538" y="426" class="small">3 blocks</text><rect x="638" y="380" width="80" height="76" rx="8" class="node"/><text x="648" y="406" class="bold">build</text><text x="648" y="426" class="small">9 blocks</text><rect x="748" y="380" width="80" height="76" rx="8" class="node"/><text x="758" y="406" class="bold">verify</text><text x="758" y="426" class="small">3 blocks</text><rect x="858" y="380" width="80" height="76" rx="8" class="node"/><text x="868" y="406" class="bold">complete</text><text x="868" y="426" class="small">3 blocks</text><line x1="388" y1="418" x2="418" y2="418" class="line"/><line x1="498" y1="418" x2="528" y2="418" class="line"/><line x1="608" y1="418" x2="638" y2="418" class="line"/><line x1="718" y1="418" x2="748" y2="418" class="lineSel"/><circle cx="718" cy="418" r="4.5" class="handle"/><circle cx="748" cy="418" r="4.5" class="handle"/><line x1="828" y1="418" x2="858" y2="418" class="line"/></g><rect x="984" y="80" width="272" height="912" rx="12" class="card" filter="url(#sh)"/><text x="1008" y="118" class="h2">Connection</text><text x="1008" y="136" class="small">An arrow only points one flow to another.</text><text x="1008" y="176" class="muted">Source · read only</text><rect x="1008" y="188" width="224" height="40" rx="8" class="box"/><text x="1020" y="213">build</text><text x="1008" y="264" class="muted">Target · read only</text><rect x="1008" y="276" width="224" height="40" rx="8" class="box"/><text x="1020" y="301">verify</text><text x="1008" y="352" class="small">Its artifacts, checks and Human approval</text><text x="1008" y="368" class="small">are in the source flow's panel:</text><text x="1008" y="384" class="small">select build.</text><rect x="1008" y="896" width="130" height="40" rx="8" class="btnDanger"/><text x="1073" y="921" class="bt-primary" text-anchor="middle">Delete connection</text><text x="1146" y="921" class="small">Asks first</text><text x="1008" y="956" class="small">Removes the link only. The flow stays.</text><text x="284" y="1025" class="muted">The work is not saved. It is lost when the browser is refreshed.</text><text x="1256" y="1025" class="caption" text-anchor="end">F-11 · screen 2 · step 3 of 4 · 1280 × 1060</text></svg>
