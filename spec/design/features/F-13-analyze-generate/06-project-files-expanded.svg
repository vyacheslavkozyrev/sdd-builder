.b12{font-size:12px;font-weight:500}
.muted{font-size:12px;fill:#636B74}
.caption{font-size:11px;fill:#636B74}
.label-cur{font-size:13px;font-weight:500;fill:#635BFF}
.label-done{font-size:12px;font-weight:500;fill:#107569}
.label-todo{font-size:12px;font-weight:500;fill:#636B74}
