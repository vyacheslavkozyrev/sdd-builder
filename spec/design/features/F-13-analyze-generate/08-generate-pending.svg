<text class="num" x="40" y="360.5" text-anchor="middle">4</text>
<text class="label-cur" x="64" y="360">Analyze and generate</text>
<g><title>Prev: go to the previous step</title><rect class="btn" x="24" y="728" width="100" height="40" rx="8"/><text class="btnDark" x="74" y="752" text-anchor="middle">Prev</text></g>
<g><title>Next is not available on the last step</title><rect class="btnOff" x="136" y="728" width="100" height="40" rx="8"/><text class="navOff" x="186" y="752" text-anchor="middle">Next</text></g>

<!-- Content card: x 284-1256, y 24-728, 12 px radius -->
<rect x="284" y="24" width="972" height="704" rx="12" class="card" filter="url(#sh)"/>
<text x="284" y="39" class="h2">Analyze</text>
<text x="284" y="62" class="muted">Checks the brief and the pipeline. Run it again after each change.</text>
<rect x="284" y="82" width="538" height="92" rx="8" fill="#F0F4F8" stroke="#DDE7EE" stroke-width="1"/>
<text x="300" y="110" class="b12">Privacy notice</text>
<text x="300" y="131">Analyze sends the brief and the pipeline to the model provider for review.</text>
<text x="300" y="150">The server does not store or log the brief.</text>
<rect x="284" y="189" width="16" height="16" rx="3" fill="#CDD7E1" stroke="#CDD7E1" stroke-width="1"/>
<path class="check" d="M288.5 197.5 L291 200 L295.5 194.5"/>
<text x="306" y="202">I have read the notice. Send the brief for review.</text>
<rect x="284" y="222" width="120" height="40" rx="8" class="btnOff"/>
<text x="344" y="247" class="disText" text-anchor="middle">Analyze</text>
<text x="284" y="300" class="h2">Findings</text>
<g>
<rect x="284" y="308" width="538" height="56" rx="8" class="row"/>
<rect x="300" y="316" width="76" height="20" rx="10" fill="#F0F4F8"/>
