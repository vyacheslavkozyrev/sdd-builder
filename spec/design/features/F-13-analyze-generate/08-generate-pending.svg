<text x="388" y="330" class="b12">Flow · complete</text>
<text x="300" y="352">No check is set on this flow.</text>
</g>
<g>
<rect x="284" y="372" width="538" height="56" rx="8" class="row"/>
<rect x="300" y="380" width="76" height="20" rx="10" fill="#F0F4F8"/>
