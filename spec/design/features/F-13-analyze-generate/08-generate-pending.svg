<text x="388" y="394" class="b12">Agent · commit</text>
<text x="300" y="416">No model is set. The agent uses the default model.</text>
</g>
<text x="284" y="452" style="font-size:13px;fill:#107569">Result: no blocker and no warning. You can generate the project.</text>
