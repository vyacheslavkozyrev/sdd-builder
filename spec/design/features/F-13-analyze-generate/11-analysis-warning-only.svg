<!-- Content card: x 284-1256, y 24-728, 12 px radius -->
<rect x="284" y="24" width="972" height="704" rx="12" class="card" filter="url(#sh)"/>
<text x="308" y="66" class="h2">Analyze</text><text x="308" y="86" class="muted">Checks the brief and the pipeline. Run it again after each change.</text><rect x="308" y="100" width="540" height="92" rx="8" fill="#F0F4F8" stroke="#DDE7EE"/><text x="324" y="122" class="b12">Privacy notice</text><text x="324" y="142">Analyze sends the brief and the pipeline to the model for review.</text><text x="324" y="160">The server does not store or log the brief.</text><g><title>Privacy notice checkbox: ticked</title><rect x="308" y="208" width="16" height="16" rx="3" fill="#635BFF" stroke="#635BFF" stroke-width="1.5"/><path class="check" d="M312.5 216.5 L315 219 L319.5 213.5"/></g><text x="336" y="221" style="font-size:11px">I have read the notice. Send the brief for review.</text><g><title>Analyze: runs the review</title><rect class="btnP" x="308" y="240" width="120" height="40" rx="8"/><text class="btnText" x="368" y="265" text-anchor="middle">Analyze</text></g><text x="308" y="320" class="b12">Findings</text><rect x="308" y="330" width="540" height="56" rx="8" fill="#FFFAEA" stroke="#DDE7EE"/><text x="324" y="352" class="b12" style="fill:#B84D05">Warning · Technical details · Rules</text><text x="324" y="372" class="muted">No rule block has a description.</text><text x="308" y="410" class="muted">Result: a warning is present. Fix it, then Analyze again to generate.</text><text x="872" y="66" class="h2">Project preview</text><text x="872" y="86" class="muted">23 files, in the order the project writes them.</text><clipPath id="clipCol"><rect x="872" y="104" width="360" height="424" rx="8"/></clipPath><rect class="panel" x="872" y="104" width="360" height="424" rx="8"/><g clip-path="url(#clipCol)"><text x="888" y="124" class="tree dir">.claude/</text><text x="904" y="144" class="tree dir">agents/</text><text x="920" y="164" class="tree">commit.md</text><text x="920" y="184" class="tree">complete.md</text><text x="920" y="204" class="tree">implement.md</text><text x="920" y="224" class="tree">plan.md</text><text x="920" y="244" class="tree">review.md</text><text x="920" y="264" class="tree">specify.md</text><text x="920" y="284" class="tree">test.md</text><text x="920" y="304" class="tree">ux.md</text><text x="920" y="324" class="tree">verify.md</text><text x="904" y="344" class="tree dir">commands/</text><text x="920" y="364" class="tree">build.md</text><text x="920" y="384" class="tree">complete.md</text><text x="920" y="404" class="tree">pipeline.md</text><text x="920" y="424" class="tree">plan.md</text><text x="920" y="444" class="tree">specify.md</text><text x="920" y="464" class="tree">ux.md</text><text x="920" y="484" class="tree">verify.md</text><text x="904" y="504" class="tree dir">rules/</text><text x="920" y="524" class="tree">general.md</text><rect x="1168" y="513" width="44" height="16" rx="8" fill="#ECF0FF"/><text class="tagT" x="1190" y="524.5" text-anchor="middle">rule</text><text x="920" y="544" class="tree">typescript.md</text><rect x="1168" y="533" width="44" height="16" rx="8" fill="#ECF0FF"/><text class="tagT" x="1190" y="544.5" text-anchor="middle">rule</text><text x="888" y="564" class="tree">CLAUDE.md</text><text x="888" y="584" class="tree dir">spec/</text><text x="904" y="604" class="tree dir">documents/</text><text x="920" y="624" class="tree">process.md</text><text x="904" y="644" class="tree dir">specifications/</text><text x="920" y="664" class="tree dir">F-00-template/</text><text x="936" y="684" class="tree">plan.md</text><text x="936" y="704" class="tree">progress.md</text><text x="936" y="724" class="tree">stories.md</text></g><rect class="thumb" x="1224" y="112" width="4" height="263" rx="2"/><g><title>Show full tree: opens the full file list</title><rect class="btn" x="872" y="544" width="360" height="36" rx="8"/><text class="btnDark" x="1052" y="566.5" text-anchor="middle">Show full tree</text></g><g><title>Generate and download: disabled</title><rect class="btnOff" x="872" y="604" width="360" height="40" rx="8"/><text class="disText" x="1052" y="629" text-anchor="middle">Generate and download</text></g><text x="872" y="664" class="muted">Fix the warning to generate</text><text x="872" y="684" class="muted">Contents are written by the model when you generate.</text>
<!-- Footer note and caption: inside the grey area, 24 px below the card -->
<text x="284" y="766" class="muted">The work is not saved. It is lost when the browser is refreshed.</text>
